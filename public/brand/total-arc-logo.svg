<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" role="img" aria-labelledby="title desc">
  <title id="title">Total ARC</title>
  <desc id="desc">Total ARC logo with an ark symbol and the tagline GRC for a more resilient tomorrow.</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#082b5c"/>
      <stop offset="100%" stop-color="#0b4d91"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0879d9"/>
      <stop offset="100%" stop-color="#1499f5"/>
    </linearGradient>
  </defs>

  <!-- Ark mark -->
  <g transform="translate(12 18)">
    <rect x="105" y="0" width="36" height="14" rx="1" fill="url(#navy)"/>
    <path d="M68 20h110l32 20v18l-87-24-87 24V40z" fill="url(#navy)"/>
    <path d="M28 76L122 40l94 36-18 66c-23 7-45 10-67 9-35-1-72-10-90-22z" fill="url(#navy)"/>
    <path d="M122 41v101" stroke="#061f43" stroke-width="7"/>
    <path d="M10 146c43-27 84-28 125-10 45 20 87 17 128-13-28 40-67 55-116 46-53-10-87-8-137 9 17-14 31-24 43-32z" fill="url(#blue)"/>
    <path d="M41 178c40-13 70-11 108 0 37 11 70 10 99-7-24 27-55 39-91 38-44-2-77-10-116-31z" fill="url(#blue)"/>
  </g>

  <!-- Divider -->
  <rect x="292" y="34" width="4" height="151" rx="2" fill="#0a3e76"/>

  <!-- Wordmark -->
  <text x="316" y="92" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="800" fill="url(#navy)">Total</text>
  <text x="312" y="166" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="900" fill="url(#blue)">ARC</text>
  <text x="317" y="197" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2.6" fill="#0b3768">GRC FOR A MORE RESILIENT TOMORROW</text>
</svg>