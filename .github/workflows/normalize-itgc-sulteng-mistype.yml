name: Normalize ITGC Bank Sulteng mistype to Bank Kalbar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-itgc-sulteng-mistype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Normalize confirmed institution-name mistype
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/normalize_itgc_alias.py <<'PY'
          import base64, hashlib, json, os, re, subprocess, tempfile, zipfile
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path

          NS={"a":"http://schemas.openxmlformats.org/spreadsheetml/2006/main","r":"http://schemas.openxmlformats.org/officeDocument/2006/relationships"}
          BATCH="AURA_ITGC_SULTENG_MISTYPE_FIX_20260921"

          def wr(args):
              return subprocess.check_output(["npx","wrangler",*args],text=True,env=os.environ,stderr=subprocess.DEVNULL)
          dbs=json.loads(wr(["d1","list","--json"]))
          db=next((x for x in dbs if re.search(r"total.?arc",x["name"],re.I)),None) or (dbs[0] if len(dbs)==1 else None)
          if not db: raise RuntimeError("TOTAL_ARC_D1_NOT_FOUND")
          DB=db["name"]

          def rows(sql):
              x=json.loads(wr(["d1","execute",DB,"--remote","--json","--command",sql]))
              x=x if isinstance(x,list) else [x]
              return [r for b in x for r in (b.get("results") or [])]
          def q(v): return "NULL" if v is None else "'" + str(v).replace("'","''") + "'"
          def sid(*parts): return hashlib.sha256("|".join(map(str,parts)).encode()).hexdigest()[:40]
          def col(ref):
              m=re.match(r"([A-Z]+)",ref or ""); n=0
              for ch in (m.group(1) if m else "A"): n=n*26+ord(ch)-64
              return n-1

          doc=rows("""
            SELECT id,institutionId,title,metadataJson,sourceModifiedAt
            FROM SourceDocument
            WHERE status='Active'
              AND json_extract(metadataJson,'$.sourceAccount')='aurakasih6987@gmail.com'
              AND title LIKE '%WLKthrough Div IT - Bank Kalbar - ITGC%'
            LIMIT 1
          """)
          if len(doc)!=1: raise RuntimeError("ITGC_SOURCE_NOT_FOUND")
          doc=doc[0]
          chunks=rows(f"SELECT chunkIndex,dataBase64 FROM SourceBinaryChunk WHERE documentId={q(doc['id'])} ORDER BY chunkIndex")
          raw=b"".join(base64.b64decode(r["dataBase64"]) for r in chunks)
          if not raw: raise RuntimeError("ITGC_RAW_MISSING")

          def sheets(raw):
              with tempfile.NamedTemporaryFile(suffix=".xlsx") as tmp:
                  tmp.write(raw); tmp.flush()
                  with zipfile.ZipFile(tmp.name) as z:
                      shared=[]
                      if "xl/sharedStrings.xml" in z.namelist():
                          root=ET.fromstring(z.read("xl/sharedStrings.xml"))
                          for si in root.findall("a:si",NS):
                              shared.append("".join((t.text or "") for t in si.findall(".//a:t",NS)))
                      wb=ET.fromstring(z.read("xl/workbook.xml"))
                      rels=ET.fromstring(z.read("xl/_rels/workbook.xml.rels"))
                      relmap={r.attrib["Id"]:r.attrib["Target"] for r in rels}
                      out={}
                      for sh in wb.findall("a:sheets/a:sheet",NS):
                          name=sh.attrib["name"]
                          rid=sh.attrib["{http://schemas.openxmlformats.org/officeDocument/2006/relationships}id"]
                          target=relmap[rid]
                          if target.startswith("/"): target=target.lstrip("/")
                          elif not target.startswith("xl/"): target="xl/"+target.lstrip("/")
                          root=ET.fromstring(z.read(target))
                          data=[]
                          for row in root.findall(".//a:sheetData/a:row",NS):
                              vals={}; mx=-1
                              for c in row.findall("a:c",NS):
                                  i=col(c.attrib.get("r","A1")); mx=max(mx,i)
                                  typ=c.attrib.get("t"); v=c.find("a:v",NS); ins=c.find("a:is",NS); value=""
                                  if typ=="s" and v is not None and v.text is not None:
                                      value=shared[int(v.text)]
                                  elif typ=="inlineStr" and ins is not None:
                                      value="".join((t.text or "") for t in ins.findall(".//a:t",NS))
                                  elif v is not None and v.text is not None:
                                      try:
                                          num=float(v.text); value=int(num) if num.is_integer() else num
                                      except: value=v.text
                                  vals[i]=value
                              data.append([vals.get(i,"") for i in range(mx+1)] if mx>=0 else [])
                          out[name]=data
                      return out
          sh=sheets(raw)
          meta=json.loads(doc.get("metadataJson") or "{}")
          priority=int(meta.get("precedencePriority",10))
          records=[]

          def add(rt,key,title,payload,period="2025-12-31"):
              payload.update({
                  "originalInstitutionLabel":"PT Bank Sulteng",
                  "normalizedInstitution":"PT Bank Kalbar",
                  "normalizationReason":"user-confirmed manual mistype",
                  "baselineOnly":True,
                  "reviewRequired":True
              })
              records.append({
                  "id":sid(doc["id"],rt,key),
                  "institutionId":doc["institutionId"],
                  "sourceDocumentId":doc["id"],
                  "recordType":rt,"recordKey":key,"recordTitle":title,"period":period,
                  "payloadJson":json.dumps(payload,ensure_ascii=False,separators=(",",":")),
                  "sourceRole":"BASELINE","precedencePriority":priority,
                  "sourceModifiedAt":doc.get("sourceModifiedAt")
              })

          bpm=sh.get("Penentuan BPM & SPB",[])
          process_count=0
          for row in bpm:
              row=row+[""]*3
              if isinstance(row[0],(int,float)) and str(row[1]).strip():
                  no=int(row[0]); name=str(row[1]).strip()
                  add("ITGC_BUSINESS_PROCESS_TEMPLATE_NORMALIZED",f"ITGC:BPM:TEMPLATE:{no:02d}",name,{
                      "number":no,"processName":name,"subprocessSummary":str(row[2]).strip() or None,
                      "sourceSheet":"Penentuan BPM & SPB","operationalMasterCreated":False
                  })
                  process_count+=1
          if process_count!=9: raise RuntimeError("ITGC_TEMPLATE_PROCESS_COUNT_"+str(process_count))

          wt=sh.get("Walkthrough Pemerliharaan IT",[])
          company_line=next((r for r in wt if len(r)>1 and str(r[0]).strip()=="Nama Perusahaan"),None)
          source_company=str(company_line[1]).strip() if company_line and len(company_line)>1 else ""
          if source_company!="PT Bank Sulteng": raise RuntimeError("EXPECTED_SULTENG_LABEL_NOT_FOUND")
          control_count=0
          current_system=None
          for row in wt:
              row=row+[""]*9
              b=str(row[1]).strip()
              if b and all(str(row[i]).strip()=="" for i in range(2,9)) and b not in {"Nama Dokumen"}:
                  if any(k in b.lower() for k in ["olibs","card management","security","confic","config","sap"]):
                      current_system=b
              activity=str(row[3]).strip()
              ctype=str(row[4]).strip()
              nature=str(row[6]).strip()
              system=str(row[8]).strip()
              if activity and ctype and nature and system and activity!="Aktivitas Pengendalian":
                  current_system=system or current_system
                  key=f"ITGC:MAINT:{re.sub(r'[^A-Z0-9]+','_',current_system.upper()).strip('_')}:{control_count+1:02d}"
                  add("ITGC_MAINTENANCE_CONTROL_CANDIDATE",key,activity,{
                      "controlActivity":activity,"controlType":ctype,"nature":nature,
                      "frequency":str(row[7]).strip() or None,"system":system,
                      "sourceSheet":"Walkthrough Pemerliharaan IT","operationalMasterCreated":False
                  })
                  control_count+=1
          if control_count!=36: raise RuntimeError("ITGC_MAINTENANCE_CONTROL_COUNT_"+str(control_count))

          now=datetime.now(timezone.utc).isoformat().replace("+00:00","Z")
          ddl="""
          CREATE TABLE IF NOT EXISTS SourceStructuredRecord (
            id TEXT PRIMARY KEY NOT NULL,institutionId TEXT NOT NULL,sourceDocumentId TEXT NOT NULL,
            recordType TEXT NOT NULL,recordKey TEXT NOT NULL,recordTitle TEXT,period TEXT,payloadJson TEXT NOT NULL,
            sourceRole TEXT NOT NULL,precedencePriority INTEGER NOT NULL DEFAULT 0,sourceModifiedAt TEXT,
            status TEXT NOT NULL DEFAULT 'Active',normalizationBatch TEXT NOT NULL,createdAt TEXT NOT NULL,updatedAt TEXT NOT NULL
          );
          CREATE UNIQUE INDEX IF NOT EXISTS idx_source_structured_source_key ON SourceStructuredRecord(sourceDocumentId,recordType,recordKey);
          CREATE INDEX IF NOT EXISTS idx_source_structured_precedence ON SourceStructuredRecord(institutionId,recordType,recordKey,precedencePriority);
          CREATE INDEX IF NOT EXISTS idx_source_structured_batch ON SourceStructuredRecord(institutionId,normalizationBatch);
          CREATE TABLE IF NOT EXISTS SourceNormalizationRun (
            id TEXT PRIMARY KEY NOT NULL,institutionId TEXT NOT NULL,batchCode TEXT NOT NULL,sourceRole TEXT NOT NULL,
            precedencePriority INTEGER NOT NULL,totalDocuments INTEGER NOT NULL,processedDocuments INTEGER NOT NULL,
            totalRecords INTEGER NOT NULL,status TEXT NOT NULL,summaryJson TEXT,startedAt TEXT NOT NULL,completedAt TEXT
          );
          CREATE UNIQUE INDEX IF NOT EXISTS idx_source_normalization_batch ON SourceNormalizationRun(institutionId,batchCode);
          """
          Path("/tmp/ddl.sql").write_text(ddl)
          subprocess.check_call(["npx","wrangler","d1","execute",DB,"--remote","--file","/tmp/ddl.sql"],env=os.environ,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)

          sql=""
          for r in records:
              sql+=f"""
              INSERT INTO SourceStructuredRecord
              (id,institutionId,sourceDocumentId,recordType,recordKey,recordTitle,period,payloadJson,sourceRole,precedencePriority,sourceModifiedAt,status,normalizationBatch,createdAt,updatedAt)
              VALUES({q(r['id'])},{q(r['institutionId'])},{q(r['sourceDocumentId'])},{q(r['recordType'])},{q(r['recordKey'])},{q(r['recordTitle'])},{q(r['period'])},{q(r['payloadJson'])},
              'BASELINE',{r['precedencePriority']},{q(r['sourceModifiedAt'])},'Active',{q(BATCH)},{q(now)},{q(now)})
              ON CONFLICT(sourceDocumentId,recordType,recordKey) DO UPDATE SET
              recordTitle=excluded.recordTitle,period=excluded.period,payloadJson=excluded.payloadJson,sourceRole='BASELINE',
              precedencePriority=excluded.precedencePriority,sourceModifiedAt=excluded.sourceModifiedAt,status='Active',
              normalizationBatch=excluded.normalizationBatch,updatedAt=excluded.updatedAt;
              """
          Path("/tmp/records.sql").write_text(sql)
          subprocess.check_call(["npx","wrangler","d1","execute",DB,"--remote","--file","/tmp/records.sql"],env=os.environ,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)

          summary={"normalizedProcessTemplates":process_count,"normalizedMaintenanceControls":control_count,
                   "originalInstitutionLabel":"PT Bank Sulteng","normalizedInstitution":"PT Bank Kalbar",
                   "normalizationReason":"user-confirmed manual mistype"}
          rid=sid(doc["institutionId"],BATCH)
          runsql=f"""
          INSERT INTO SourceNormalizationRun
          (id,institutionId,batchCode,sourceRole,precedencePriority,totalDocuments,processedDocuments,totalRecords,status,summaryJson,startedAt,completedAt)
          VALUES({q(rid)},{q(doc['institutionId'])},{q(BATCH)},'BASELINE',10,1,1,{len(records)},'Completed',{q(json.dumps(summary,separators=(',',':')))}, {q(now)},{q(now)})
          ON CONFLICT(institutionId,batchCode) DO UPDATE SET processedDocuments=1,totalRecords={len(records)},status='Completed',
          summaryJson={q(json.dumps(summary,separators=(',',':')))},completedAt={q(now)};
          """
          Path("/tmp/run.sql").write_text(runsql)
          subprocess.check_call(["npx","wrangler","d1","execute",DB,"--remote","--file","/tmp/run.sql"],env=os.environ,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)

          verify=rows(f"SELECT recordType,COUNT(*) records FROM SourceStructuredRecord WHERE normalizationBatch={q(BATCH)} AND status='Active' GROUP BY recordType ORDER BY recordType")
          total=sum(int(r["records"]) for r in verify)
          if total!=45: raise RuntimeError("NORMALIZED_MISTYPE_COUNT_"+str(total))
          print(json.dumps({"batch":BATCH,"status":"Completed","records":verify,"activeTotal":total},indent=2))
          PY
          python /tmp/normalize_itgc_alias.py
          rm -f /tmp/normalize_itgc_alias.py /tmp/*.sql
