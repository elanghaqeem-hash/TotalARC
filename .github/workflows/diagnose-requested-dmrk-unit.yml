name: Diagnose requested DMRK organization unit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-requested-dmrk-unit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Inspect exact DMRK record and references
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1-list.json
          DB_NAME="$(jq -r '
            (map(select((.name|ascii_downcase|contains("totalarc")) or (.name|ascii_downcase|contains("total-arc")))) | .[0].name) //
            (if length == 1 then .[0].name else empty end)
          ' /tmp/d1-list.json)"
          test -n "$DB_NAME"
          echo "Database: $DB_NAME"
          npx wrangler d1 execute "$DB_NAME" --remote --json --command "
            SELECT id,institutionId,legalEntityId,parentId,type,code,name,headName,headEmail,status,createdAt,updatedAt
            FROM OrganizationUnit
            WHERE code='DMRK' AND name='Direktorat Manajemen Risiko dan Kepatuhan';
          "
          npx wrangler d1 execute "$DB_NAME" --remote --json --command "
            SELECT COUNT(*) AS childCount
            FROM OrganizationUnit
            WHERE parentId IN (
              SELECT id FROM OrganizationUnit
              WHERE code='DMRK' AND name='Direktorat Manajemen Risiko dan Kepatuhan'
            );
          "
          npx wrangler d1 execute "$DB_NAME" --remote --json --command "
            SELECT COUNT(*) AS processReferences
            FROM BusinessProcess
            WHERE orgUnitId IN (
              SELECT id FROM OrganizationUnit
              WHERE code='DMRK' AND name='Direktorat Manajemen Risiko dan Kepatuhan'
            );
          "
