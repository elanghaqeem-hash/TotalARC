name: Refresh sharp lockfile

on:
  push:
    branches:
      - feat/ai-provider-order-ui-20261006
    paths:
      - '.github/workflows/refresh-sharp-lock.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/ai-provider-order-ui-20261006

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Refresh vulnerable sharp resolution
        run: |
          npm audit fix --package-lock-only --omit=dev --ignore-scripts
          node -e "const p=require('./package-lock.json'); console.log('resolved sharp:',p.packages['node_modules/sharp']?.version)"
          npm audit --omit=dev --audit-level=moderate

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: refresh sharp lockfile"
          git push origin HEAD:feat/ai-provider-order-ui-20261006
