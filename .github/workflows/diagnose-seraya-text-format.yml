name: Diagnose Seraya indexed text format

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-seraya-text-format.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Inspect bounded marker context
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/diag.py <<'PY'
          import json, os, re, subprocess

          def wr(args):
              return subprocess.check_output(["npx","wrangler",*args],text=True,env=os.environ,stderr=subprocess.DEVNULL)
          dbs=json.loads(wr(["d1","list","--json"]))
          db=next((x for x in dbs if re.search(r"total.?arc",x["name"],re.I)),None) or dbs[0]
          DB=db["name"]
          def rows(sql):
              raw=json.loads(wr(["d1","execute",DB,"--remote","--json","--command",sql]))
              raw=raw if isinstance(raw,list) else [raw]
              return [r for b in raw for r in (b.get("results") or [])]
          def q(v): return "'" + str(v).replace("'","''") + "'"

          checks=[
            ("Dokumen 2 Kertas Kerja Penentuan Materialitas",["OVERALL MATERIALITY (OM)","RASIO PM / OM","Status Kertas Kerja"]),
            ("Dokumen 3 Gap_Analysis_BPM_RCM",["G-01","G-64"]),
            ("Dokumen 7_Kerangka_Metodologi_ICOFR_2026",["Overall Materiality (OM)","Performance Materiality (PM)","Haircut"]),
            ("Dokumen 9 Register_Risiko_Pelaporan_Keuangan_2026",["REGISTER RISIKO PELAPORAN KEUANGAN PER AKUN SIGNIFIKAN","R-CKP-01"])
          ]
          for token,markers in checks:
              doc=rows(f"""
                SELECT id,title FROM SourceDocument
                WHERE status='Active'
                  AND json_extract(metadataJson,'$.sourceAccount')='serayamg@gmail.com'
                  AND title LIKE '%' || {q(token)} || '%'
                LIMIT 1
              """)[0]
              chunks=rows(f"SELECT textContent FROM SourceTextChunk WHERE documentId={q(doc['id'])} ORDER BY chunkIndex")
              text="".join(str(r.get("textContent") or "") for r in chunks)
              print("\n### "+doc["title"])
              print("TEXT_PREFIX_REPR="+repr(text[:220]))
              for marker in markers:
                  pos=text.lower().find(marker.lower())
                  print("MARKER="+marker+" POS="+str(pos))
                  if pos>=0:
                      start=max(0,pos-120); end=min(len(text),pos+420)
                      print("CONTEXT_REPR="+repr(text[start:end]))
          PY
          python /tmp/diag.py
          rm -f /tmp/diag.py
