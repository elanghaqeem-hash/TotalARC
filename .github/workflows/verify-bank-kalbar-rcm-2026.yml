name: Verify Bank Kalbar RCM production

on:
  workflow_run:
    workflows: ["Harden Bank Kalbar RCM 2026"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: totalarc-bank-kalbar-rcm-production-verify
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TOTAL_ARC_HEALTHCHECK_TOKEN: ${{ secrets.TOTAL_ARC_HEALTHCHECK_TOKEN }}
      TOTALARC_PRODUCTION_URL: ${{ vars.TOTALARC_PRODUCTION_URL }}
    steps:
      - name: Verify governed RCM through production API
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TOTAL_ARC_HEALTHCHECK_TOKEN:-}" ]; then
            echo "::error::TOTAL_ARC_HEALTHCHECK_TOKEN is required."
            exit 1
          fi

          BASE_URL="${TOTALARC_PRODUCTION_URL:-https://totalarc.elang-haqeem.workers.dev}"
          BASE_URL="${BASE_URL%/}"
          OUTPUT=/tmp/totalarc-rcm.json

          healthy=false
          for attempt in $(seq 1 24); do
            code="$(curl --silent --show-error --location --max-time 25               --output "$OUTPUT"               --write-out "%{http_code}"               --header "X-Total-ARC-Health-Token: $TOTAL_ARC_HEALTHCHECK_TOKEN"               "$BASE_URL/api/rcm" || true)"

            if [ "$code" = "200" ] && jq -e '
              (.total == 132) and
              (([.rcm[].controlId] | unique | length) == 132) and
              (.summary.controls == 132) and
              (.summary.uusControls == 42) and
              (.summary.itgcControls == 10) and
              (.summary.ckpnRequirements == 9) and
              (.summary.reverseRepoRequirements == 1) and
              (.summary.elcDraftReferences == 63) and
              (.summary.integrity == "PASS") and
              (.governance.legacyTotal == 124) and
              (.governance.latestIntegrity.status == "PASS") and
              (([.governance.requirements[] | select(.category == "CKPN")] | length) == 9) and
              (([.governance.requirements[] | select(.category == "Reverse Repo")] | length) == 1) and
              (([.rcm[] | select(.sourceCycle == "SYH") | .controlId] | unique | length) == 42) and
              (([.rcm[] | select(.isItgc == true) | .controlId] | unique | length) == 10) and
              (([.rcm[] | select((.controlId | startswith("ELC-")))] | length) == 0) and
              (([.governance.draftReferenceSummary[]
                  | select(
                      .sourceStatus == "ILLUSTRATIVE_DRAFT" and
                      (.referenceType == "ELC_PRINCIPLE_TEMPLATE_REFERENCE" or
                       .referenceType == "ELC_BPM_NARRATIVE_REFERENCE")
                    )
                  | (.records // 0)] | add // 0) == 63)
            ' "$OUTPUT" >/dev/null 2>&1; then
              healthy=true
              break
            fi

            echo "RCM production convergence pending (attempt $attempt/24, HTTP ${code:-unknown})."
            sleep 15
          done

          if [ "$healthy" != "true" ]; then
            echo "::error::Production RCM governance verification failed."
            cat "$OUTPUT" | jq '{
              total,
              summary,
              uniqueControls: ([.rcm[].controlId] | unique | length),
              governance: {
                legacyTotal: .governance.legacyTotal,
                requirements: (.governance.requirements | map({requirementCode, category, status})),
                draftReferenceSummary: .governance.draftReferenceSummary,
                sourceMetadataSummary: .governance.sourceMetadataSummary,
                latestIntegrity: .governance.latestIntegrity
              },
              uus: ([.rcm[] | select(.sourceCycle == "SYH") | .controlId] | unique | length),
              itgc: ([.rcm[] | select(.isItgc == true) | .controlId] | unique | length)
            }' || cat "$OUTPUT"
            exit 1
          fi

          jq '{
            totalRows: .total,
            uniqueControls: ([.rcm[].controlId] | unique | length),
            controls: .summary.controls,
            uusControls: .summary.uusControls,
            itgcControls: .summary.itgcControls,
            ckpnRequirements: .summary.ckpnRequirements,
            reverseRepoRequirements: .summary.reverseRepoRequirements,
            elcDraftReferences: .summary.elcDraftReferences,
            legacyControls: .governance.legacyTotal,
            integrity: .summary.integrity
          }' "$OUTPUT"
