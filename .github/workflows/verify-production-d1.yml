name: Verify production D1 persistence

on:
  workflow_run:
    workflows:
      - Deploy Total ARC to Cloudflare
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production-d1:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify read-only D1 health
        shell: bash
        run: |
          set -euo pipefail
          URL="https://totalarc.serayamg.workers.dev/api/system/database"
          RESPONSE=""

          for attempt in $(seq 1 20); do
            echo "Production D1 health attempt $attempt"
            RESPONSE="$(curl --silent --show-error --location --max-time 20 "$URL" || true)"

            if printf '%s' "$RESPONSE" | jq -e '
              .ok == true and
              .persistent == true and
              .database == "cloudflare-d1" and
              .mutationPerformed == false and
              (.counts.institutions | type) == "number" and
              (.counts.processCategories | type) == "number" and
              .referenceDataReady == true and
              (.counts.processes | type) == "number" and
              (.counts.risks | type) == "number" and
              (.counts.controls | type) == "number"
            ' >/dev/null 2>&1; then
              echo "Cloudflare D1 is reachable and the health check is read-only."
              printf '%s\n' "$RESPONSE" | jq '{
                ok,
                database,
                persistent,
                mutationPerformed,
                counts,
                referenceDataReady,
                latestAuditTimestamp
              }'
              exit 0
            fi

            echo "Production endpoint not ready or D1 health not verified yet."
            sleep 5
          done

          echo "Production D1 health could not be verified."
          printf '%s\n' "$RESPONSE"
          exit 1
