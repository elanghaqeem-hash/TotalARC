name: Verify production D1 persistence

on:
  workflow_run:
    workflows:
      - Deploy Total ARC to Cloudflare
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production-d1:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TOTALARC_PRODUCTION_URL: ${{ vars.TOTALARC_PRODUCTION_URL }}
    steps:
      - name: Verify production D1 connectivity
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="${TOTALARC_PRODUCTION_URL:-https://totalarc.elang-haqeem.workers.dev}"
          BASE_URL="${BASE_URL%/}"
          URL="$BASE_URL/api/system/database"
          RESPONSE=""

          for attempt in $(seq 1 12); do
            echo "Production D1 verification attempt $attempt"
            HTTP_CODE="$(curl --silent --show-error --location --max-time 20 \
              --output /tmp/totalarc-d1-health.json \
              --write-out "%{http_code}" \
              "$URL" || true)"

            RESPONSE="$(cat /tmp/totalarc-d1-health.json 2>/dev/null || true)"

            if [ "$HTTP_CODE" = "200" ] && printf '%s' "$RESPONSE" | jq -e '
              .ok == true and
              .persistent == true and
              .database == "cloudflare-d1" and
              .readOnlyProbe == true and
              .health.binding == "DB" and
              .health.queryOk == true and
              (.health.tableCount | type) == "number"
            ' >/dev/null 2>&1; then
              echo "Total ARC production D1 binding and read-only query are healthy."
              printf '%s\n' "$RESPONSE" | jq '{
                ok,
                database,
                persistent,
                readOnlyProbe,
                health
              }'
              exit 0
            fi

            echo "Production D1 endpoint not ready yet (HTTP ${HTTP_CODE:-unknown})."
            sleep 5
          done

          echo "::error::Total ARC production D1 connectivity could not be verified."
          printf '%s\n' "$RESPONSE"
          exit 1

      - name: Smoke test production D1 APIs
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="${TOTALARC_PRODUCTION_URL:-https://totalarc.elang-haqeem.workers.dev}"
          BASE_URL="${BASE_URL%/}"

          check_json() {
            local name="$1"
            local path="$2"
            local expression="$3"
            local output="/tmp/totalarc-smoke-${name}.json"

            echo "Checking $name at $path"
            local http_code
            http_code="$(curl --silent --show-error --location --max-time 25 \
              --output "$output" \
              --write-out "%{http_code}" \
              "$BASE_URL$path" || true)"

            if [ "$http_code" != "200" ]; then
              echo "::error::$name returned HTTP ${http_code:-unknown}."
              cat "$output" 2>/dev/null || true
              return 1
            fi

            if ! jq -e "$expression" "$output" >/dev/null 2>&1; then
              echo "::error::$name returned an unexpected production payload."
              cat "$output" 2>/dev/null || true
              return 1
            fi

            echo "$name: healthy"
          }

          check_json "database" "/api/system/database" '
            .ok == true and
            .database == "cloudflare-d1" and
            .persistent == true and
            .readOnlyProbe == true
          '

          check_json "organization" "/api/organization" '
            .storage == "cloudflare-d1" and
            (.legalEntities | type) == "array" and
            (.organizationUnits | type) == "array"
          '

          check_json "processes" "/api/processes" '
            .storage == "cloudflare-d1" and
            (.processes | type) == "array" and
            (.categories | type) == "array"
          '

          check_json "risks" "/api/risks" '
            .storage == "cloudflare-d1" and
            (.risks | type) == "array"
          '

          check_json "controls" "/api/controls" '
            .storage == "cloudflare-d1" and
            (.controls | type) == "array"
          '

          check_json "rcm" "/api/rcm" '
            .storage == "cloudflare-d1" and
            (.rcm | type) == "array" and
            (.total | type) == "number"
          '

          check_json "dashboard" "/api/dashboard" '
            .storage == "cloudflare-d1" and
            (.metrics | type) == "object" and
            (.executiveQandA | type) == "array"
          '

          check_json "toe" "/api/assure/toe" '
            .storage == "cloudflare-d1" and
            (.tests | type) == "array"
          '

          check_json "remediation" "/api/assure/remediation" '
            .storage == "cloudflare-d1" and
            (.exceptions | type) == "array" and
            (.deficiencies | type) == "array" and
            (.issues | type) == "array" and
            (.maps | type) == "array" and
            (.retests | type) == "array"
          '

          check_json "ccm" "/api/monitor/ccm" '
            .storage == "cloudflare-d1" and
            (.rules | type) == "array"
          '

          check_json "assurance-integration" "/api/assurance?sections=integration" '
            .storage == "cloudflare-d1" and
            .dataStatus == "complete" and
            (.degradedModules | length) == 0 and
            (.campaigns | type) == "array" and
            (.controls | type) == "array" and
            (.tasks | type) == "array" and
            (.todTests | type) == "array" and
            (.toeTests | type) == "array" and
            (.actionPlans | type) == "array"
          '

          check_json "icofr-hub" "/api/icofr/hub" '
            .storage == "cloudflare-d1" and
            (.counts | type) == "object" and
            (.traceabilityMetrics | type) == "object" and
            (.testingMetrics | type) == "object"
          '

          check_json "icofr-scoping" "/api/icofr/scoping" '
            .storage == "cloudflare-d1" and
            (.scopes | type) == "array"
          '

          check_json "icofr-financial-items" "/api/icofr/financial-items" '
            .storage == "cloudflare-d1" and
            (.records | type) == "array"
          '

          check_json "icofr-traceability" "/api/icofr/traceability" '
            .storage == "cloudflare-d1" and
            (.chains | type) == "array"
          '

          check_json "icofr-coverage" "/api/icofr/coverage" '
            .storage == "cloudflare-d1" and
            (.metrics | type) == "object"
          '

          check_json "icofr-elc" "/api/icofr/controls?category=ELC" '
            .storage == "cloudflare-d1" and
            .category == "ELC" and
            (.records | type) == "array"
          '

          check_json "icofr-plc" "/api/icofr/controls?category=PLC" '
            .storage == "cloudflare-d1" and
            .category == "PLC" and
            (.records | type) == "array"
          '

          check_json "icofr-itgc" "/api/icofr/controls?category=ITGC" '
            .storage == "cloudflare-d1" and
            .category == "ITGC" and
            (.records | type) == "array"
          '

          check_json "icofr-itac" "/api/icofr/controls?category=ITAC" '
            .storage == "cloudflare-d1" and
            .category == "ITAC" and
            (.records | type) == "array"
          '

          check_json "icofr-information" "/api/icofr/information" '
            .storage == "cloudflare-d1" and
            (.records | type) == "array"
          '

          check_json "icofr-testing-plan" "/api/icofr/testing-plan" '
            .storage == "cloudflare-d1" and
            (.planItems | type) == "array" and
            (.cycles | type) == "array"
          '

          check_json "icofr-deficiencies" "/api/icofr/deficiencies" '
            .storage == "cloudflare-d1" and
            (.records | type) == "array"
          '

          check_json "icofr-certification" "/api/icofr/certification" '
            .storage == "cloudflare-d1" and
            (.attestations | type) == "array" and
            (.subCertifications | type) == "array"
          '

          check_json "icofr-reporting" "/api/icofr/reporting" '
            .storage == "cloudflare-d1" and
            (.pbcRequests | type) == "array" and
            (.reportPacks | type) == "array"
          '

          check_json "icofr-roll-forward" "/api/icofr/roll-forward" '
            .storage == "cloudflare-d1" and
            (.sourceCloses | type) == "array" and
            (.rollForwards | type) == "array" and
            (.metrics | type) == "object"
          '

          check_json "icofr-smart-testing" "/api/icofr/smart-testing" '
            .storage == "cloudflare-d1" and
            (.cycles | type) == "array" and
            (.runs | type) == "array" and
            (.metrics | type) == "object"
          '

          check_json "icofr-sampling-evidence" "/api/icofr/sampling-evidence" '
            .storage == "cloudflare-d1" and
            (.eligiblePlanItems | type) == "array" and
            (.samplingPlans | type) == "array" and
            (.evidenceRequests | type) == "array" and
            (.metrics | type) == "object"
          '

          check_json "icofr-workpaper-review" "/api/icofr/workpaper-review" '
            .storage == "cloudflare-d1" and
            (.workpapers | type) == "array" and
            (.reviews | type) == "array" and
            (.openReviewNotes | type) == "array" and
            (.metrics | type) == "object"
          '

          check_json "evidence-repository" "/api/evidence" '
            .storage == "cloudflare-d1" and
            (.documents | type) == "array" and
            (.linkTargets | type) == "array" and
            (.metrics | type) == "object" and
            .limits.storageMode == "D1_CHUNKED"
          '

          check_json "database-final" "/api/system/database" '
            .ok == true and
            .database == "cloudflare-d1" and
            .persistent == true and
            .health.requiredTablesReady == true and
            (.health.missingRequiredTables | length) == 0
          '

          echo "All Total ARC production D1 API smoke tests passed."
