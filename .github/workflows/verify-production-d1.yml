name: Verify production D1 persistence

on:
  workflow_run:
    workflows:
      - Deploy Total ARC to Cloudflare
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production-d1:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TOTALARC_PRODUCTION_URL: ${{ vars.TOTALARC_PRODUCTION_URL }}
      TOTAL_ARC_HEALTHCHECK_TOKEN: ${{ secrets.TOTAL_ARC_HEALTHCHECK_TOKEN }}
    steps:
      - name: Verify production D1 connectivity
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${TOTAL_ARC_HEALTHCHECK_TOKEN:-}" ]; then
            echo "::error::Repository secret TOTAL_ARC_HEALTHCHECK_TOKEN is required for authenticated production probes."
            exit 1
          fi

          BASE_URL="${TOTALARC_PRODUCTION_URL:-https://totalarc.elang-haqeem.workers.dev}"
          BASE_URL="${BASE_URL%/}"
          URL="$BASE_URL/api/system/database"
          RESPONSE=""

          for attempt in $(seq 1 12); do
            echo "Production D1 verification attempt $attempt"
            HTTP_CODE="$(curl --silent --show-error --location --max-time 20 \
              --output /tmp/totalarc-d1-health.json \
              --write-out "%{http_code}" \
              --header "X-Total-ARC-Health-Token: $TOTAL_ARC_HEALTHCHECK_TOKEN" \
              "$URL" || true)"

            RESPONSE="$(cat /tmp/totalarc-d1-health.json 2>/dev/null || true)"

            if [ "$HTTP_CODE" = "200" ] && printf '%s' "$RESPONSE" | jq -e '
              .ok == true and
              .persistent == true and
              .database == "cloudflare-d1" and
              .readOnlyProbe == true and
              .health.binding == "DB" and
              .health.queryOk == true and
              (.health.tableCount | type) == "number"
            ' >/dev/null 2>&1; then
              echo "Total ARC production D1 binding and read-only query are healthy."
              printf '%s\n' "$RESPONSE" | jq '{
                ok,
                database,
                persistent,
                readOnlyProbe,
                health
              }'
              exit 0
            fi

            echo "Production D1 endpoint not ready yet (HTTP ${HTTP_CODE:-unknown})."
            sleep 5
          done

          echo "::error::Total ARC production D1 connectivity could not be verified."
          printf '%s\n' "$RESPONSE"
          exit 1

      - name: Smoke test production D1 APIs
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="${TOTALARC_PRODUCTION_URL:-https://totalarc.elang-haqeem.workers.dev}"
          BASE_URL="${BASE_URL%/}"

          # The health token is intentionally limited to system/read-only probes.
          # Operational APIs such as /api/onboarding, /api/organization, /api/processes,
          # risk/control workspaces, and tenant-scoped assurance endpoints must continue
          # to require a real authenticated user session and are covered by pre-merge
          # Auth Security / Tenant Isolation / negative tests.
          check_json() {
            local name="$1"
            local path="$2"
            local expression="$3"
            local output="/tmp/totalarc-smoke-${name}.json"

            echo "Checking $name at $path"
            local http_code
            http_code="$(curl --silent --show-error --location --max-time 30 \
              --output "$output" \
              --write-out "%{http_code}" \
              --header "X-Total-ARC-Health-Token: $TOTAL_ARC_HEALTHCHECK_TOKEN" \
              "$BASE_URL$path" || true)"

            if [ "$http_code" != "200" ]; then
              echo "::error::$name returned HTTP ${http_code:-unknown}."
              cat "$output" 2>/dev/null || true
              return 1
            fi

            if ! jq -e "$expression" "$output" >/dev/null 2>&1; then
              echo "::error::$name returned an unexpected production payload."
              cat "$output" 2>/dev/null || true
              return 1
            fi

            echo "$name: healthy"
          }

          check_json "database" "/api/system/database" '
            .ok == true and
            .database == "cloudflare-d1" and
            .persistent == true and
            .readOnlyProbe == true and
            .health.binding == "DB" and
            .health.queryOk == true and
            .health.requiredTablesReady == true and
            (.health.missingRequiredTables | length) == 0
          '

          check_json "rcm-integrity" "/api/system/rcm-integrity" '
            .ok == true and
            .storage == "cloudflare-d1" and
            .test == "RCM_PRODUCTION_INTEGRITY" and
            .summary.controls == 132 and
            .summary.uusControls == 42 and
            .summary.itgcControls == 10 and
            .summary.ckpnRequirements == 9 and
            .summary.reverseRepoRequirements == 1 and
            .summary.elcDraftReferences == 63 and
            .summary.integrity == "PASS"
          '

          check_json "icofr-integrity" "/api/system/icofr-integrity" '
            .ok == true and
            .storage == "cloudflare-d1" and
            .test == "ICOFR_END_TO_END_REFERENTIAL_INTEGRITY" and
            .completenessTest == "ICOFR_TRACEABILITY_COMPLETENESS" and
            .checkedInstitutions >= 1 and
            .orphanCount == 0 and
            .crossTenantCount == 0 and
            .mandatoryChainGapCount == 0 and
            (.metrics | type) == "object" and
            (.metrics.significantFinancialItems | type) == "number" and
            (.metrics.significantFinancialItemsWithAssertion | type) == "number" and
            (.metrics.inScopeAssertions | type) == "number" and
            (.metrics.assertionsWithProcess | type) == "number" and
            (.metrics.assertionsWithRisk | type) == "number" and
            (.metrics.assertionsWithControl | type) == "number" and
            (.metrics.controlsWithToD | type) == "number" and
            (.metrics.controlsWithToE | type) == "number" and
            (.metrics.exceptionsWithDeficiency | type) == "number" and
            (.metrics.deficienciesWithIssue | type) == "number" and
            (.metrics.issuesWithMAP | type) == "number" and
            (.metrics.completeChains | type) == "number" and
            (.metrics.incompleteChains | type) == "number" and
            (.metrics.coveragePercent | type) == "number" and
            ([.checks[] | select(.count != 0)] | length) == 0 and
            ([.completenessChecks[] | select(.count != 0)] | length) == 0
          '

          echo "All TotalARC production system smoke probes passed."
