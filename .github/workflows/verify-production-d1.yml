name: Verify production D1 persistence

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production-d1:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger and verify Bank Kalbar persistence
        shell: bash
        run: |
          set -euo pipefail
          URL="https://totalarc.serayamg.workers.dev/api/system/database"
          RESPONSE=""

          for attempt in $(seq 1 30); do
            echo "Production D1 verification attempt $attempt"
            RESPONSE="$(curl --silent --show-error --location --max-time 20 "$URL" || true)"

            if printf '%s' "$RESPONSE" | jq -e '
              .ok == true and
              .persistent == true and
              .database == "cloudflare-d1" and
              .institution.name == "Bank Kalbar" and
              .institution.legalName == "PT. Bank Pembangunan Daerah Kalimantan Barat"
            ' >/dev/null 2>&1; then
              echo "Bank Kalbar is persisted in Cloudflare D1."
              printf '%s\n' "$RESPONSE" | jq '{
                ok,
                database,
                persistent,
                institution,
                auditLogCount: (.auditLogs | length)
              }'
              exit 0
            fi

            echo "Production endpoint not ready or persistence not verified yet."
            sleep 10
          done

          echo "Bank Kalbar persistence could not be verified from production."
          printf '%s\n' "$RESPONSE"
          exit 1
