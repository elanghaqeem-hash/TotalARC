name: Verify production D1 persistence

on:
  workflow_run:
    workflows:
      - Deploy Total ARC to Cloudflare
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production-d1:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TOTALARC_PRODUCTION_URL: ${{ vars.TOTALARC_PRODUCTION_URL }}
    steps:
      - name: Verify production D1 connectivity
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="${TOTALARC_PRODUCTION_URL:-https://totalarc.elang-haqeem.workers.dev}"
          BASE_URL="${BASE_URL%/}"
          URL="$BASE_URL/api/system/database"
          RESPONSE=""

          for attempt in $(seq 1 12); do
            echo "Production D1 verification attempt $attempt"
            HTTP_CODE="$(curl --silent --show-error --location --max-time 20 \
              --output /tmp/totalarc-d1-health.json \
              --write-out "%{http_code}" \
              "$URL" || true)"

            RESPONSE="$(cat /tmp/totalarc-d1-health.json 2>/dev/null || true)"

            if [ "$HTTP_CODE" = "200" ] && printf '%s' "$RESPONSE" | jq -e '
              .ok == true and
              .persistent == true and
              .database == "cloudflare-d1" and
              .readOnlyProbe == true and
              .health.binding == "DB" and
              .health.queryOk == true and
              (.health.tableCount | type) == "number"
            ' >/dev/null 2>&1; then
              echo "Total ARC production D1 binding and read-only query are healthy."
              printf '%s\n' "$RESPONSE" | jq '{
                ok,
                database,
                persistent,
                readOnlyProbe,
                health
              }'
              exit 0
            fi

            echo "Production D1 endpoint not ready yet (HTTP ${HTTP_CODE:-unknown})."
            sleep 5
          done

          echo "::error::Total ARC production D1 connectivity could not be verified."
          printf '%s\n' "$RESPONSE"
          exit 1

      - name: Verify anonymous operational access is denied
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="${TOTALARC_PRODUCTION_URL:-https://totalarc.elang-haqeem.workers.dev}"
          BASE_URL="${BASE_URL%/}"

          check_denied() {
            local name="$1"
            local path="$2"
            local output="/tmp/totalarc-auth-${name}.txt"

            echo "Checking anonymous denial for $name at $path"
            local http_code
            http_code="$(curl --silent --show-error --max-time 20 \
              --output "$output" \
              --write-out "%{http_code}" \
              "$BASE_URL$path" || true)"

            case "$http_code" in
              302|401|403)
                echo "$name: anonymous access denied (HTTP $http_code)"
                ;;
              *)
                echo "::error::$name unexpectedly allowed or mishandled anonymous access (HTTP ${http_code:-unknown})."
                cat "$output" 2>/dev/null || true
                return 1
                ;;
            esac
          }

          check_denied "auth-me" "/api/auth/me"
          check_denied "processes" "/api/processes"
          check_denied "risks" "/api/risks"
          check_denied "controls" "/api/controls"
          check_denied "rcm" "/api/rcm"
          check_denied "dashboard" "/api/dashboard"
          check_denied "toe" "/api/assure/toe"
          check_denied "remediation" "/api/assure/remediation"
          check_denied "ccm" "/api/monitor/ccm"
          check_denied "ai-status" "/api/ai/status"

          echo "All protected Total ARC operational endpoints deny anonymous access."
