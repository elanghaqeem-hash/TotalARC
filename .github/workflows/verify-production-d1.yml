name: Verify production D1 persistence

on:
  workflow_run:
    workflows:
      - Deploy Total ARC to Cloudflare
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production-d1:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TOTALARC_PRODUCTION_URL: ${{ vars.TOTALARC_PRODUCTION_URL }}
    steps:
      - name: Verify production D1 connectivity
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="${TOTALARC_PRODUCTION_URL:-https://totalarc.elang-haqeem.workers.dev}"
          BASE_URL="${BASE_URL%/}"
          URL="$BASE_URL/api/system/database"
          RESPONSE=""

          for attempt in $(seq 1 12); do
            echo "Production D1 verification attempt $attempt"
            HTTP_CODE="$(curl --silent --show-error --location --max-time 20 \
              --output /tmp/totalarc-d1-health.json \
              --write-out "%{http_code}" \
              "$URL" || true)"

            RESPONSE="$(cat /tmp/totalarc-d1-health.json 2>/dev/null || true)"

            if [ "$HTTP_CODE" = "200" ] && printf '%s' "$RESPONSE" | jq -e '
              .ok == true and
              .persistent == true and
              .database == "cloudflare-d1" and
              .readOnlyProbe == true and
              .health.binding == "DB" and
              .health.queryOk == true and
              (.health.tableCount | type) == "number"
            ' >/dev/null 2>&1; then
              echo "Total ARC production D1 binding and read-only query are healthy."
              printf '%s\n' "$RESPONSE" | jq '{
                ok,
                database,
                persistent,
                readOnlyProbe,
                health
              }'
              exit 0
            fi

            echo "Production D1 endpoint not ready yet (HTTP ${HTTP_CODE:-unknown})."
            sleep 5
          done

          echo "::error::Total ARC production D1 connectivity could not be verified."
          printf '%s\n' "$RESPONSE"
          exit 1

      - name: Smoke test production D1 APIs
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="${TOTALARC_PRODUCTION_URL:-https://totalarc.elang-haqeem.workers.dev}"
          BASE_URL="${BASE_URL%/}"

          check_json() {
            local name="$1"
            local path="$2"
            local expression="$3"
            local output="/tmp/totalarc-smoke-${name}.json"

            echo "Checking $name at $path"
            local http_code
            http_code="$(curl --silent --show-error --location --max-time 25 \
              --output "$output" \
              --write-out "%{http_code}" \
              "$BASE_URL$path" || true)"

            if [ "$http_code" != "200" ]; then
              echo "::error::$name returned HTTP ${http_code:-unknown}."
              cat "$output" 2>/dev/null || true
              return 1
            fi

            if ! jq -e "$expression" "$output" >/dev/null 2>&1; then
              echo "::error::$name returned an unexpected production payload."
              cat "$output" 2>/dev/null || true
              return 1
            fi

            echo "$name: healthy"
          }

          check_json "database" "/api/system/database" '
            .ok == true and
            .database == "cloudflare-d1" and
            .persistent == true and
            .readOnlyProbe == true
          '

          check_json "auth-ready" "/api/auth/login" '
            .ready == true and
            .credentialMode == "LOCAL" and
            (.passwordPolicy | type) == "object"
          '

          check_status() {
            local name="$1"
            local path="$2"
            local expected="$3"
            local output="/tmp/totalarc-status-\${name}.json"
            local http_code

            http_code="$(curl --silent --show-error --location --max-time 25 \
              --output "$output" \
              --write-out "%{http_code}" \
              "$BASE_URL$path" || true)"

            if [ "$http_code" != "$expected" ]; then
              echo "::error::$name expected HTTP $expected but received \${http_code:-unknown}."
              cat "$output" 2>/dev/null || true
              return 1
            fi
            echo "$name: protected as expected (HTTP $expected)"
          }

          check_status "dashboard-protected" "/api/dashboard" "401"
          check_status "organization-protected" "/api/organization" "401"
          check_status "processes-protected" "/api/processes" "401"
          check_status "risks-protected" "/api/risks" "401"
          check_status "controls-protected" "/api/controls" "401"
          check_status "rcm-protected" "/api/rcm" "401"
          check_status "assurance-protected" "/api/assurance?sections=integration" "401"
          check_status "toe-protected" "/api/assure/toe" "401"
          check_status "remediation-protected" "/api/assure/remediation" "401"
          check_status "ccm-protected" "/api/monitor/ccm" "401"
          check_status "evidence-protected" "/api/evidence" "401"
          check_status "icofr-hub-protected" "/api/icofr/hub" "401"
          check_status "icofr-workpaper-review-protected" "/api/icofr/workpaper-review" "401"
          check_status "user-admin-protected" "/api/admin/users" "401"
          check_status "tenant-admin-protected" "/api/admin/institutions" "401"
          check_status "security-admin-protected" "/api/admin/security" "401"

          check_json "database-final" "/api/system/database" '
            .ok == true and
            .database == "cloudflare-d1" and
            .persistent == true and
            .health.requiredTablesReady == true and
            (.health.missingRequiredTables | length) == 0
          '

          echo "Total ARC production D1 health, authentication readiness, and unauthenticated access controls passed."
