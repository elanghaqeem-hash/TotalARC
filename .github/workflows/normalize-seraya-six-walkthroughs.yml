name: Normalize six Seraya walkthrough updates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-seraya-six-walkthroughs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: totalarc-seraya-six-walkthroughs
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Normalize six Seraya walkthrough archive members
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/normalize_six_walkthroughs.py <<'PY'
          import hashlib, json, os, re, subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          BATCH="SERAYA_UPDATE_WALKTHROUGH_6_20260921"

          TARGETS=[
            ("AML","81a8c78c-3e2d-4e06-8eac-1eb69af50295"),
            ("CLOSE_BOOK","8a37550e-ae54-4afd-9e1a-26ba2f74fdac"),
            ("KUR","81873415-1c65-457c-8e1a-ca297b792052"),
            ("KUR_IB","c37819f9-11d4-44a6-a4fc-3287c9ebe50f"),
            ("INVESTMENT_LOAN","fe9619e0-cc37-4203-a2b5-30fc584d61b8"),
            ("KPR","94ca5dbc-0065-4082-8068-97629a339b23"),
          ]

          def wr(args):
              return subprocess.check_output(["npx","wrangler",*args],text=True,env=os.environ,stderr=subprocess.DEVNULL)

          dbs=json.loads(wr(["d1","list","--json"]))
          db=next((x for x in dbs if re.search(r"total.?arc",x["name"],re.I)),None) or (dbs[0] if len(dbs)==1 else None)
          if not db: raise RuntimeError("TOTAL_ARC_D1_NOT_FOUND")
          DB=db["name"]

          def rows(sql):
              raw=json.loads(wr(["d1","execute",DB,"--remote","--json","--command",sql]))
              raw=raw if isinstance(raw,list) else [raw]
              return [r for b in raw for r in (b.get("results") or [])]

          def q(v): return "NULL" if v is None else "'" + str(v).replace("'","''") + "'"
          def hid(*p): return hashlib.sha256("|".join(map(str,p)).encode()).hexdigest()[:40]
          def compact(row): return [str(v).strip() for v in row if str(v).strip()]

          docs={}
          for code,doc_id in TARGETS:
              found=rows(f"""
                SELECT id,institutionId,title,module,sourceKind,sourceModifiedAt,metadataJson,textLength,rawSizeBytes
                FROM SourceDocument
                WHERE id={q(doc_id)} AND status='Active'
                LIMIT 1
              """)
              if len(found)!=1: raise RuntimeError(f"SOURCE_NOT_FOUND_{code}")
              d=found[0]
              chunks=rows(f"SELECT chunkIndex,textContent FROM SourceTextChunk WHERE documentId={q(doc_id)} ORDER BY chunkIndex")
              text="".join(str(x.get("textContent") or "") for x in chunks)
              if not text.strip(): raise RuntimeError(f"SOURCE_TEXT_MISSING_{code}")
              d["text"]=text
              docs[code]=d
              print(f"{code} source={d['title']} textLength={len(text)}")

          institution_id=next(iter(docs.values()))["institutionId"]
          if any(d["institutionId"]!=institution_id for d in docs.values()):
              raise RuntimeError("INSTITUTION_MISMATCH")

          records=[]
          issues=[]
          source_stats={}
          now=datetime.now(timezone.utc).isoformat().replace("+00:00","Z")

          def add_issue(doc,issue_type,severity,description,record_key=None,field=None,observed=None,expected=None):
              issues.append({
                "id":hid(doc["id"],issue_type,record_key or "",field or ""),
                "institutionId":institution_id,
                "sourceDocumentId":doc["id"],
                "sourceRecordKey":record_key,
                "issueType":issue_type,
                "severity":severity,
                "fieldName":field,
                "observedValue":observed,
                "expectedContext":expected,
                "description":description,
              })

          for code,doc in docs.items():
              sessions=[]
              example_rows=0
              malformed_candidates=0
              for line in doc["text"].splitlines():
                  parts=line.split("\t")
                  vals=compact(parts)
                  if len(vals)<2: continue
                  first=vals[0]
                  second=vals[1] if len(vals)>1 else ""

                  if first.lower().startswith("contoh") and second in {"Awal","Pemutakhiran"}:
                      example_rows+=1
                      continue

                  if not re.fullmatch(r"\d+",first) or second not in {"Awal","Pemutakhiran"}:
                      continue

                  if len(vals)<16:
                      malformed_candidates+=1
                      continue

                  no=int(first)
                  vals=vals+[""]*(18-len(vals))
                  session={
                    "sessionNumber":no,
                    "walkthroughType":vals[1] or None,
                    "updateTrigger":vals[2] or None,
                    "executionDate":vals[3] or None,
                    "businessProcess":vals[4] or None,
                    "subprocess":vals[5] or None,
                    "processOwner":vals[6] or None,
                    "secondLineAccompanied":vals[7] or None,
                    "inquiry":vals[8] or None,
                    "documentsInspected":vals[9] or None,
                    "observation":vals[10] or None,
                    "changeDescription":vals[11] or None,
                    "documentsImpacted":vals[12] or None,
                    "changeLogRecorded":vals[13] or None,
                    "effectiveQuarterForCSA":vals[14] or None,
                    "conclusion":vals[15] or None,
                    "consistencyValidation":vals[16] or None,
                    "notes":vals[17] or None,
                    "sourceProcessCode":code,
                    "sourceRole":"UPDATE",
                    "precedencePriority":20,
                    "reviewRequired":True,
                    "operationalWalkthroughCreated":False
                  }
                  key=f"SERAYA:WT:2026:{code}:{no:02d}"
                  records.append({
                    "id":hid(doc["id"],"WALKTHROUGH_SESSION_UPDATE_CANDIDATE",key),
                    "institutionId":institution_id,
                    "sourceDocumentId":doc["id"],
                    "recordType":"WALKTHROUGH_SESSION_UPDATE_CANDIDATE",
                    "recordKey":key,
                    "recordTitle":(session["businessProcess"] or code)+" — "+(session["subprocess"] or f"Session {no}"),
                    "period":"2026",
                    "payloadJson":json.dumps(session,ensure_ascii=False,separators=(",",":")),
                    "sourceModifiedAt":doc.get("sourceModifiedAt")
                  })
                  sessions.append(session)

                  date=session.get("executionDate") or ""
                  match=re.search(r"(20\d{2})$",date)
                  if match and int(match.group(1))!=2026:
                      add_issue(
                        doc,"DATE_OUTSIDE_TARGET_YEAR","HIGH",
                        "Walkthrough execution date is outside the 2026 source period. Original source value is preserved.",
                        key,"executionDate",date,"Source filename and period indicate 2026"
                      )

                  if not session.get("businessProcess") or not session.get("subprocess"):
                      add_issue(
                        doc,"WALKTHROUGH_PROCESS_KEY_MISSING","HIGH",
                        "Walkthrough row is missing business-process/subprocess identification required for operational promotion.",
                        key,"businessProcess/subprocess",
                        f"{session.get('businessProcess')} / {session.get('subprocess')}",
                        "Both business process and subprocess should be identified"
                      )

              if len(sessions)==0:
                  raise RuntimeError(f"NO_REAL_WALKTHROUGH_SESSIONS_{code}")

              if malformed_candidates:
                  add_issue(
                    doc,"MALFORMED_WALKTHROUGH_ROWS","MEDIUM",
                    "One or more rows looked like real walkthrough sessions but did not contain enough fields for the standard schema.",
                    observed=str(malformed_candidates),expected="At least 16 populated columns per session row"
                  )

              recap=None
              for line in doc["text"].splitlines():
                  if "Total Sesi Walkthrough Dilaksanakan" in line:
                      vals=compact(line.split("\t"))
                      for value in reversed(vals):
                          if re.fullmatch(r"\d+(?:\.0+)?",value):
                              recap=int(float(value)); break
                      break
              if recap is not None and recap!=len(sessions):
                  add_issue(
                    doc,"RECAP_SESSION_COUNT_MISMATCH","MEDIUM",
                    "Workbook recap does not match parsed real session rows after example/template rows are excluded.",
                    observed=str(recap),
                    expected=f"{len(sessions)} real walkthrough rows; {example_rows} example rows excluded"
                  )

              source_stats[code]={
                "title":doc["title"],
                "realSessions":len(sessions),
                "examplesExcluded":example_rows,
                "recap":recap,
                "malformedCandidates":malformed_candidates
              }
              print(f"{code} realSessions={len(sessions)} examplesExcluded={example_rows} recap={recap}")

          ddl="""
          CREATE TABLE IF NOT EXISTS SourceStructuredRecord (
            id TEXT PRIMARY KEY NOT NULL,institutionId TEXT NOT NULL,sourceDocumentId TEXT NOT NULL,
            recordType TEXT NOT NULL,recordKey TEXT NOT NULL,recordTitle TEXT,period TEXT,payloadJson TEXT NOT NULL,
            sourceRole TEXT NOT NULL,precedencePriority INTEGER NOT NULL DEFAULT 0,sourceModifiedAt TEXT,
            status TEXT NOT NULL DEFAULT 'Active',normalizationBatch TEXT NOT NULL,createdAt TEXT NOT NULL,updatedAt TEXT NOT NULL
          );
          CREATE UNIQUE INDEX IF NOT EXISTS idx_source_structured_source_key
            ON SourceStructuredRecord(sourceDocumentId,recordType,recordKey);
          CREATE TABLE IF NOT EXISTS SourceDataIssue (
            id TEXT PRIMARY KEY NOT NULL,institutionId TEXT NOT NULL,sourceDocumentId TEXT NOT NULL,sourceRecordKey TEXT,
            issueType TEXT NOT NULL,severity TEXT NOT NULL,fieldName TEXT,observedValue TEXT,expectedContext TEXT,
            description TEXT NOT NULL,issueStatus TEXT NOT NULL DEFAULT 'OPEN',createdAt TEXT NOT NULL,updatedAt TEXT NOT NULL
          );
          CREATE TABLE IF NOT EXISTS SourceNormalizationRun (
            id TEXT PRIMARY KEY NOT NULL,institutionId TEXT NOT NULL,batchCode TEXT NOT NULL,sourceRole TEXT NOT NULL,
            precedencePriority INTEGER NOT NULL,totalDocuments INTEGER NOT NULL,processedDocuments INTEGER NOT NULL,
            totalRecords INTEGER NOT NULL,status TEXT NOT NULL,summaryJson TEXT,startedAt TEXT NOT NULL,completedAt TEXT
          );
          CREATE UNIQUE INDEX IF NOT EXISTS idx_source_normalization_batch
            ON SourceNormalizationRun(institutionId,batchCode);
          """
          Path("/tmp/w6_ddl.sql").write_text(ddl)
          subprocess.check_call(["npx","wrangler","d1","execute",DB,"--remote","--file","/tmp/w6_ddl.sql"],env=os.environ,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)

          source_ids=[d["id"] for d in docs.values()]
          cleanup="\n".join(
            f"UPDATE SourceStructuredRecord SET status='Superseded',updatedAt={q(now)} WHERE sourceDocumentId={q(doc_id)} AND normalizationBatch={q(BATCH)} AND status='Active';"
            for doc_id in source_ids
          )
          cleanup+="\n"+"\n".join(f"DELETE FROM SourceDataIssue WHERE sourceDocumentId={q(doc_id)};" for doc_id in source_ids)
          Path("/tmp/w6_cleanup.sql").write_text(cleanup)
          subprocess.check_call(["npx","wrangler","d1","execute",DB,"--remote","--file","/tmp/w6_cleanup.sql"],env=os.environ,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)

          def rec_sql(r):
              return f"""
              INSERT INTO SourceStructuredRecord
              (id,institutionId,sourceDocumentId,recordType,recordKey,recordTitle,period,payloadJson,sourceRole,precedencePriority,sourceModifiedAt,status,normalizationBatch,createdAt,updatedAt)
              VALUES({q(r['id'])},{q(r['institutionId'])},{q(r['sourceDocumentId'])},{q(r['recordType'])},{q(r['recordKey'])},{q(r['recordTitle'])},{q(r['period'])},{q(r['payloadJson'])},
              'UPDATE',20,{q(r['sourceModifiedAt'])},'Active',{q(BATCH)},{q(now)},{q(now)})
              ON CONFLICT(sourceDocumentId,recordType,recordKey) DO UPDATE SET
                recordTitle=excluded.recordTitle,period=excluded.period,payloadJson=excluded.payloadJson,
                sourceRole='UPDATE',precedencePriority=20,sourceModifiedAt=excluded.sourceModifiedAt,status='Active',
                normalizationBatch=excluded.normalizationBatch,updatedAt=excluded.updatedAt;
              """

          statements=[rec_sql(r) for r in records]
          for x in issues:
              statements.append(f"""
              INSERT INTO SourceDataIssue
              (id,institutionId,sourceDocumentId,sourceRecordKey,issueType,severity,fieldName,observedValue,expectedContext,description,issueStatus,createdAt,updatedAt)
              VALUES({q(x['id'])},{q(x['institutionId'])},{q(x['sourceDocumentId'])},{q(x['sourceRecordKey'])},{q(x['issueType'])},{q(x['severity'])},
              {q(x['fieldName'])},{q(x['observedValue'])},{q(x['expectedContext'])},{q(x['description'])},'OPEN',{q(now)},{q(now)})
              ON CONFLICT(id) DO UPDATE SET severity=excluded.severity,fieldName=excluded.fieldName,observedValue=excluded.observedValue,
              expectedContext=excluded.expectedContext,description=excluded.description,issueStatus='OPEN',updatedAt=excluded.updatedAt;
              """)

          for start in range(0,len(statements),75):
              p=f"/tmp/w6_rows_{start//75:03d}.sql"
              Path(p).write_text("\n".join(statements[start:start+75]))
              subprocess.check_call(["npx","wrangler","d1","execute",DB,"--remote","--file",p],env=os.environ,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)

          run_id=hid(institution_id,BATCH)
          summary={"sources":source_stats,"issues":len(issues)}
          runsql=f"""
          INSERT INTO SourceNormalizationRun
          (id,institutionId,batchCode,sourceRole,precedencePriority,totalDocuments,processedDocuments,totalRecords,status,summaryJson,startedAt,completedAt)
          VALUES({q(run_id)},{q(institution_id)},{q(BATCH)},'UPDATE',20,6,6,{len(records)},'Completed',{q(json.dumps(summary,separators=(',',':')))}, {q(now)},{q(now)})
          ON CONFLICT(institutionId,batchCode) DO UPDATE SET
            sourceRole='UPDATE',precedencePriority=20,totalDocuments=6,processedDocuments=6,totalRecords={len(records)},
            status='Completed',summaryJson={q(json.dumps(summary,separators=(',',':')))},completedAt={q(now)};
          """
          Path("/tmp/w6_run.sql").write_text(runsql)
          subprocess.check_call(["npx","wrangler","d1","execute",DB,"--remote","--file","/tmp/w6_run.sql"],env=os.environ,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)

          verify=rows(f"""
            SELECT sourceDocumentId,COUNT(*) records
            FROM SourceStructuredRecord
            WHERE institutionId={q(institution_id)} AND normalizationBatch={q(BATCH)} AND status='Active'
            GROUP BY sourceDocumentId
            ORDER BY sourceDocumentId
          """)
          if len(verify)!=6: raise RuntimeError(f"DOCUMENT_VERIFY_COUNT_{len(verify)}_6")
          if sum(int(x["records"]) for x in verify)!=len(records):
              raise RuntimeError("RECORD_VERIFY_COUNT_MISMATCH")

          issue_verify=rows(f"""
            SELECT issueType,severity,COUNT(*) records
            FROM SourceDataIssue
            WHERE institutionId={q(institution_id)} AND issueStatus='OPEN'
              AND sourceDocumentId IN ({','.join(q(x) for x in source_ids)})
            GROUP BY issueType,severity
            ORDER BY severity,issueType
          """)

          print(json.dumps({
            "processedDocuments":6,
            "activeRecords":len(records),
            "sourceStats":source_stats,
            "sourceIssues":issue_verify
          },indent=2,ensure_ascii=False))
          PY

          python /tmp/normalize_six_walkthroughs.py
          rm -f /tmp/normalize_six_walkthroughs.py /tmp/w6_*.sql
