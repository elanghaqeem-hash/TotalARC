name: Diagnose source precedence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-source-precedence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Inspect source-library provenance metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1.json
          DB_NAME="$(jq -r '(map(select((.name|ascii_downcase|contains("totalarc")) or (.name|ascii_downcase|contains("total-arc")))) | .[0].name) // (if length == 1 then .[0].name else empty end)' /tmp/d1.json)"
          test -n "$DB_NAME"

          echo "=== SOURCE COUNTS ==="
          npx wrangler d1 execute "$DB_NAME" --remote --json --command "
            SELECT COUNT(*) AS documents,
                   SUM(CASE WHEN sourceKind='ROOT_FILE' THEN 1 ELSE 0 END) AS rootFiles,
                   SUM(CASE WHEN sourceKind='ARCHIVE_MEMBER' THEN 1 ELSE 0 END) AS archiveMembers,
                   SUM(CASE WHEN rawSizeBytes>0 THEN 1 ELSE 0 END) AS withRaw,
                   SUM(CASE WHEN textLength>0 THEN 1 ELSE 0 END) AS withText
            FROM SourceDocument WHERE status='Active';
          "

          echo "=== METADATA KEYS ==="
          npx wrangler d1 execute "$DB_NAME" --remote --json --command "
            SELECT DISTINCT je.key AS metadataKey
            FROM SourceDocument s, json_each(COALESCE(s.metadataJson,'{}')) je
            ORDER BY metadataKey;
          "

          echo "=== SOURCE ORIGIN SUMMARY ==="
          npx wrangler d1 execute "$DB_NAME" --remote --json --command "
            SELECT
              COALESCE(json_extract(metadataJson,'$.sourceAccount'), json_extract(metadataJson,'$.sourceDrive'), json_extract(metadataJson,'$.account'), 'UNSPECIFIED') AS origin,
              COALESCE(json_extract(metadataJson,'$.sourceRole'), json_extract(metadataJson,'$.role'), 'UNSPECIFIED') AS sourceRole,
              COALESCE(json_extract(metadataJson,'$.priority'), json_extract(metadataJson,'$.precedencePriority'), -1) AS priority,
              COUNT(*) AS records
            FROM SourceDocument
            WHERE status='Active'
            GROUP BY origin, sourceRole, priority
            ORDER BY priority, origin;
          "

          echo "=== SOURCE TITLE CATALOG ==="
          npx wrangler d1 execute "$DB_NAME" --remote --json --command "
            SELECT title, provider, sourceKind, module,
                   rawSha256, textSha256,
                   COALESCE(json_extract(metadataJson,'$.sourceAccount'), json_extract(metadataJson,'$.sourceDrive'), json_extract(metadataJson,'$.account'), 'UNSPECIFIED') AS origin,
                   COALESCE(json_extract(metadataJson,'$.sourceRole'), json_extract(metadataJson,'$.role'), 'UNSPECIFIED') AS sourceRole,
                   COALESCE(json_extract(metadataJson,'$.priority'), json_extract(metadataJson,'$.precedencePriority'), -1) AS priority
            FROM SourceDocument
            WHERE status='Active'
            ORDER BY priority, sourceKind, title;
          "
