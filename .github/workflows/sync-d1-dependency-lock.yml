name: Prepare D1 dependency and migration

on:
  push:
    branches:
      - hardening/d1-unified-storage
    paths:
      - .github/workflows/sync-d1-dependency-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-d1:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and synchronize dependencies
        run: npm install --ignore-scripts

      - name: Generate initial D1 migration
        run: npm run prisma:migration:diff

      - name: Verify persistence guardrails
        run: npm run verify:no-dummy

      - name: Build OpenNext Worker
        run: npm run build

      - name: Commit generated lockfile and migration
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json migrations/0001_initial.sql
          if git diff --cached --quiet; then
            echo "Generated files are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate D1 lockfile and initial migration"
          git push
