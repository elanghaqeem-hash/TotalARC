name: Deploy Total ARC to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: totalarc-production-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Verify immutable CI action refs
        run: npm run verify:ci-supply-chain

      - name: Install dependencies
        run: npm ci

      - name: Validate Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN."
            echo "### Deployment blocked" >> "$GITHUB_STEP_SUMMARY"
            echo "- Add repository secret CLOUDFLARE_API_TOKEN." >> "$GITHUB_STEP_SUMMARY"
            missing=1
          fi

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID."
            echo "### Cloudflare account ID required" >> "$GITHUB_STEP_SUMMARY"
            echo "- Add CLOUDFLARE_ACCOUNT_ID as a repository variable or repository secret." >> "$GITHUB_STEP_SUMMARY"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "Cloudflare deployment credentials are configured."

      - name: Audit optional external AI provider secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          echo "### AI provider configuration" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cloudflare Workers AI: required native binding" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$GEMINI_API_KEY" ]; then echo "- Gemini: configured in GitHub Actions" >> "$GITHUB_STEP_SUMMARY"; else echo "- Gemini: not configured" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -n "$GROQ_API_KEY" ]; then echo "- Groq: configured in GitHub Actions" >> "$GITHUB_STEP_SUMMARY"; else echo "- Groq: not configured" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -n "$OPENROUTER_API_KEY" ]; then echo "- OpenRouter: configured in GitHub Actions" >> "$GITHUB_STEP_SUMMARY"; else echo "- OpenRouter: not configured" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Validate D1 deployment permission
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if ! npx wrangler d1 list --json >/tmp/totalarc-d1-list.json 2>/tmp/totalarc-d1-error.log; then
            echo "::error::Cloudflare token cannot access D1. Total ARC cannot safely deploy its DB binding."
            echo "### Cloudflare D1 permission required" >> "$GITHUB_STEP_SUMMARY"
            echo "The deployment token is valid, but it cannot list/provision D1 databases." >> "$GITHUB_STEP_SUMMARY"
            echo "Grant D1 Edit/Write permission for the Total ARC Cloudflare account, then rerun this workflow." >> "$GITHUB_STEP_SUMMARY"
            tail -n 20 /tmp/totalarc-d1-error.log || true
            exit 1
          fi
          echo "Cloudflare D1 access is available."

      - name: Resolve and pin production D1 binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CONFIGURED_D1_DATABASE_ID: ${{ vars.TOTALARC_D1_DATABASE_ID }}
          CONFIGURED_D1_DATABASE_NAME: ${{ vars.TOTALARC_D1_DATABASE_NAME }}
          ALLOW_D1_REBIND: ${{ vars.TOTALARC_ALLOW_D1_REBIND }}
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/totalarc/settings"
          SETTINGS_HTTP="$(curl --silent --show-error --max-time 20             --output /tmp/totalarc-worker-settings.json             --write-out "%{http_code}"             --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "$SETTINGS_URL" || true)"

          CURRENT_ID=""
          if [ "$SETTINGS_HTTP" = "200" ]; then
            CURRENT_ID="$(jq -r '
              .result.bindings[]?
              | select(.type == "d1" and .name == "DB")
              | (.database_id // .id // empty)
            ' /tmp/totalarc-worker-settings.json | head -n 1)"
          fi

          TARGET_ID="${CONFIGURED_D1_DATABASE_ID:-$CURRENT_ID}"

          if [ -z "$TARGET_ID" ] && [ -n "${CONFIGURED_D1_DATABASE_NAME:-}" ]; then
            TARGET_ID="$(jq -r --arg name "$CONFIGURED_D1_DATABASE_NAME" '
              .[]
              | select((.name // "") == $name)
              | (.uuid // .id // empty)
            ' /tmp/totalarc-d1-list.json | head -n 1)"
          fi

          if [ -z "$TARGET_ID" ]; then
            CANDIDATE_COUNT="$(jq '[.[] | select((.name // "") | test("total.?arc"; "i"))] | length' /tmp/totalarc-d1-list.json)"
            if [ "$CANDIDATE_COUNT" = "1" ]; then
              TARGET_ID="$(jq -r '
                .[]
                | select((.name // "") | test("total.?arc"; "i"))
                | (.uuid // .id // empty)
              ' /tmp/totalarc-d1-list.json)"
            fi
          fi

          if [ -z "$TARGET_ID" ]; then
            echo "::error::Unable to determine a unique production D1 database. Configure repository variable TOTALARC_D1_DATABASE_ID."
            exit 1
          fi

          TARGET_NAME="$(jq -r --arg id "$TARGET_ID" '
            .[]
            | select((.uuid // .id // "") == $id)
            | (.name // empty)
          ' /tmp/totalarc-d1-list.json | head -n 1)"

          if [ -z "$TARGET_NAME" ]; then
            echo "::error::Resolved D1 database ID is not present in the Cloudflare account."
            exit 1
          fi

          if [ -n "${CONFIGURED_D1_DATABASE_NAME:-}" ] && [ "$CONFIGURED_D1_DATABASE_NAME" != "$TARGET_NAME" ]; then
            echo "::error::TOTALARC_D1_DATABASE_NAME does not match the database resolved from TOTALARC_D1_DATABASE_ID."
            exit 1
          fi

          if [ -n "$CURRENT_ID" ] && [ "$CURRENT_ID" != "$TARGET_ID" ] && [ "${ALLOW_D1_REBIND:-false}" != "true" ]; then
            echo "::error::Deployment would rebind production DB from the currently attached D1 database. Set TOTALARC_ALLOW_D1_REBIND=true only for an explicitly approved migration."
            exit 1
          fi

          echo "::add-mask::$TARGET_ID"
          echo "TOTALARC_D1_DATABASE_ID=$TARGET_ID" >> "$GITHUB_ENV"
          echo "TOTALARC_D1_DATABASE_NAME=$TARGET_NAME" >> "$GITHUB_ENV"
          echo "TOTALARC_WRANGLER_CONFIG=wrangler.production.json" >> "$GITHUB_ENV"

          TOTALARC_D1_DATABASE_ID="$TARGET_ID"           TOTALARC_D1_DATABASE_NAME="$TARGET_NAME"             node scripts/prepare-production-d1-config.cjs

          jq -e --arg id "$TARGET_ID" --arg name "$TARGET_NAME" '
            [.d1_databases[]
              | select(
                  .binding == "DB" and
                  .database_id == $id and
                  .database_name == $name
                )
            ] | length == 1
          ' wrangler.production.json >/dev/null

          npx wrangler d1 execute "$TARGET_NAME" --remote --json             --command "SELECT COUNT(*) AS count FROM Institution WHERE legalName = 'PT. Bank Pembangunan Daerah Kalimantan Barat'"             >/tmp/totalarc-d1-identity.json

          if ! jq -e '([.[]?.results[]? | (.count // 0)] | add // 0) >= 1' /tmp/totalarc-d1-identity.json >/dev/null; then
            echo "::error::Resolved production D1 does not contain the expected Bank Kalbar institution identity."
            exit 1
          fi

          MASKED_ID="${TARGET_ID:0:8}…${TARGET_ID: -4}"
          echo "### Deterministic production D1 binding" >> "$GITHUB_STEP_SUMMARY"
          echo "- Binding: DB" >> "$GITHUB_STEP_SUMMARY"
          echo "- Database name: $TARGET_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Database ID: $MASKED_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Existing Worker binding preserved: $([ -n "$CURRENT_ID" ] && echo yes || echo not-yet-bound)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Auto-provisioning: disabled for production deploy" >> "$GITHUB_STEP_SUMMARY"

      - name: Backfill missing process objectives
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          TOTALARC_D1_DATABASE_ID: ${{ env.TOTALARC_D1_DATABASE_ID }}
          TOTALARC_D1_DATABASE_NAME: ${{ env.TOTALARC_D1_DATABASE_NAME }}
        run: python scripts/backfill-process-objectives.py

      - name: Validate Workers AI account inference
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          MODEL="@cf/qwen/qwen3-30b-a3b-fp8"
          URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/run/$MODEL"
          HTTP_CODE=$(curl --silent --show-error --output /tmp/workers-ai-preflight.json --write-out "%{http_code}"             --request POST "$URL"             --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             --header "Content-Type: application/json"             --data '{"messages":[{"role":"user","content":"Reply with OK only."}],"max_tokens":16,"temperature":0}')

          SUCCESS=$(jq -r '.success // false' /tmp/workers-ai-preflight.json 2>/dev/null || echo false)
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ] || [ "$SUCCESS" != "true" ]; then
            echo "::error::Cloudflare Workers AI account inference preflight failed (HTTP $HTTP_CODE)."
            echo "### Workers AI account preflight failed" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.errors[]? | "- " + ((.code // "unknown")|tostring) + ": " + (.message // "Unknown Workers AI error")' /tmp/workers-ai-preflight.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            exit 1
          fi
          echo "Cloudflare Workers AI account inference is available."

      - name: Verify no dummy operational data
        run: npm run verify:no-dummy

      - name: Verify sidebar module integrity
        run: npm run verify:modules

      - name: Verify authentication security integrity
        run: npm run verify:auth-security

      - name: Verify HTTP security headers configuration
        run: npm run verify:security-headers

      - name: Verify D1 schema stability
        run: |
          npm run verify:d1-schema-stability
          npm run verify:d1-binding-config

      - name: Verify RCM integrity contract
        run: npm run verify:rcm-integrity

      - name: Verify ICOFR traceability integrity contract
        run: npm run verify:icofr-traceability

      - name: Verify AI security and banking redaction
        run: npm run verify:ai-security

      - name: Verify TypeScript
        run: npm run typecheck

      - name: Verify multi-institution isolation
        run: npm run verify:tenant-isolation

      - name: Verify saved process flow persistence
        run: npm run verify:process-flow

      - name: Verify supporting document AI workflow
        run: npm run verify:process-document-ai

      - name: Verify BPM-to-AI Risk Register
        run: npm run verify:ai-risk-register
      - name: Verify AI significant account scoping
        run: npm run verify:ai-significant-accounts

      - name: Verify AI OM/PM materiality
        run: npm run verify:ai-materiality

      - name: Verify RCSA/CSA participating units
        run: npm run verify:rcsa-campaign-units

      - name: Build OpenNext Worker
        run: npm run build

      - name: Deploy Worker with pinned Cloudflare bindings
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.production.json --no-x-provision

      - name: Verify production D1 binding identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS_URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/totalarc/settings"

          verified=false
          for attempt in $(seq 1 12); do
            HTTP_CODE="$(curl --silent --show-error --max-time 20               --output /tmp/totalarc-worker-settings-after.json               --write-out "%{http_code}"               --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               "$SETTINGS_URL" || true)"

            if [ "$HTTP_CODE" = "200" ]; then
              BOUND_ID="$(jq -r '
                .result.bindings[]?
                | select(.type == "d1" and .name == "DB")
                | (.database_id // .id // empty)
              ' /tmp/totalarc-worker-settings-after.json | head -n 1)"

              if [ "$BOUND_ID" = "$TOTALARC_D1_DATABASE_ID" ]; then
                verified=true
                break
              fi
            fi

            echo "Production D1 binding identity not propagated yet (attempt $attempt/12)."
            sleep 5
          done

          if [ "$verified" != "true" ]; then
            echo "::error::Production Worker DB binding does not match the pinned TotalARC D1 database."
            exit 1
          fi

          echo "Production Worker binding DB is pinned to the expected D1 database."

      - name: Verify production security headers
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          FALLBACK_URL: ${{ vars.TOTALARC_PRODUCTION_URL }}
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="${DEPLOYMENT_URL:-${FALLBACK_URL:-https://totalarc.elang-haqeem.workers.dev}}"
          BASE_URL="${BASE_URL%/}"
          HEADER_FILE="/tmp/totalarc-security-headers.txt"

          success=false
          for attempt in $(seq 1 12); do
            if curl --silent --show-error --location --max-time 20 --dump-header "$HEADER_FILE" --output /dev/null "$BASE_URL/login"; then
              lower_headers="$(tr '[:upper:]' '[:lower:]' < "$HEADER_FILE")"
              missing=0

              for header in                 "content-security-policy:"                 "strict-transport-security:"                 "x-content-type-options:"                 "referrer-policy:"                 "permissions-policy:"                 "x-frame-options:"; do
                if ! printf '%s' "$lower_headers" | grep -q "^$header"; then
                  missing=1
                  echo "Security header not observed yet: $header"
                fi
              done

              if ! printf '%s' "$lower_headers" | grep -q "frame-ancestors 'none'"; then
                missing=1
                echo "CSP frame-ancestors 'none' not observed yet."
              fi

              if [ "$missing" -eq 0 ]; then
                success=true
                break
              fi
            fi

            echo "Security headers not fully propagated yet (attempt $attempt/12)."
            sleep 5
          done

          if [ "$success" != "true" ]; then
            echo "::error::Production security header verification failed."
            sed -n '1,120p' "$HEADER_FILE" 2>/dev/null || true
            exit 1
          fi

          echo "### HTTP security headers" >> "$GITHUB_STEP_SUMMARY"
          echo "- Content-Security-Policy: present" >> "$GITHUB_STEP_SUMMARY"
          echo "- Strict-Transport-Security: present" >> "$GITHUB_STEP_SUMMARY"
          echo "- X-Content-Type-Options: present" >> "$GITHUB_STEP_SUMMARY"
          echo "- Referrer-Policy: present" >> "$GITHUB_STEP_SUMMARY"
          echo "- Permissions-Policy: present" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frame protection: CSP frame-ancestors none + X-Frame-Options DENY" >> "$GITHUB_STEP_SUMMARY"

      - name: Sync runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOTAL_ARC_AUTH_SECRET: ${{ secrets.TOTAL_ARC_AUTH_SECRET }}
          AUTH_MFA_MASTER_KEY: ${{ secrets.AUTH_MFA_MASTER_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AUTH_EMAIL_FROM: ${{ secrets.AUTH_EMAIL_FROM }}
          AUTH_SSO_MFA_GATEWAY_SECRET: ${{ secrets.AUTH_SSO_MFA_GATEWAY_SECRET }}
          AUTH_WEBAUTHN_ORIGIN: ${{ vars.AUTH_WEBAUTHN_ORIGIN }}
          AUTH_WEBAUTHN_RP_ID: ${{ vars.AUTH_WEBAUTHN_RP_ID }}
          TOTAL_ARC_BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.TOTAL_ARC_BOOTSTRAP_ADMIN_EMAIL }}
          TOTAL_ARC_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.TOTAL_ARC_BOOTSTRAP_ADMIN_PASSWORD }}
          TOTAL_ARC_BOOTSTRAP_ADMIN_NAME: ${{ secrets.TOTAL_ARC_BOOTSTRAP_ADMIN_NAME }}
          TOTAL_ARC_HEALTHCHECK_TOKEN: ${{ secrets.TOTAL_ARC_HEALTHCHECK_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          put_secret() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" --config wrangler.production.json >/dev/null
              echo "$name synchronized to the Total ARC Worker."
            fi
          }

          AI_PROBE_TOKEN="$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$AI_PROBE_TOKEN"
          echo "AI_PROBE_TOKEN=$AI_PROBE_TOKEN" >> "$GITHUB_ENV"

          put_secret GEMINI_API_KEY "$GEMINI_API_KEY"
          put_secret GROQ_API_KEY "$GROQ_API_KEY"
          put_secret OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
          put_secret TOTAL_ARC_AUTH_SECRET "$TOTAL_ARC_AUTH_SECRET"
          put_secret AUTH_MFA_MASTER_KEY "$AUTH_MFA_MASTER_KEY"
          put_secret RESEND_API_KEY "$RESEND_API_KEY"
          put_secret AUTH_EMAIL_FROM "$AUTH_EMAIL_FROM"
          put_secret AUTH_SSO_MFA_GATEWAY_SECRET "$AUTH_SSO_MFA_GATEWAY_SECRET"
          put_secret AUTH_WEBAUTHN_ORIGIN "$AUTH_WEBAUTHN_ORIGIN"
          put_secret AUTH_WEBAUTHN_RP_ID "$AUTH_WEBAUTHN_RP_ID"
          put_secret TOTAL_ARC_BOOTSTRAP_ADMIN_EMAIL "$TOTAL_ARC_BOOTSTRAP_ADMIN_EMAIL"
          put_secret TOTAL_ARC_BOOTSTRAP_ADMIN_PASSWORD "$TOTAL_ARC_BOOTSTRAP_ADMIN_PASSWORD"
          put_secret TOTAL_ARC_BOOTSTRAP_ADMIN_NAME "$TOTAL_ARC_BOOTSTRAP_ADMIN_NAME"
          put_secret TOTAL_ARC_HEALTHCHECK_TOKEN "$TOTAL_ARC_HEALTHCHECK_TOKEN"

          if [ -z "$TOTAL_ARC_AUTH_SECRET" ] || [ -z "$TOTAL_ARC_BOOTSTRAP_ADMIN_EMAIL" ] || [ -z "$TOTAL_ARC_BOOTSTRAP_ADMIN_PASSWORD" ]; then
            echo "::warning::Total ARC authentication secrets are incomplete. The deployed application will require authentication configuration before users can sign in."
          fi

          # Write the short-lived probe token last so the final secret-only
          # deployment is the one the verification step waits for.
          put_secret AI_PROBE_TOKEN "$AI_PROBE_TOKEN"

      - name: Provision bootstrap administrator
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          FALLBACK_URL: ${{ vars.TOTALARC_PRODUCTION_URL }}
          TOTAL_ARC_HEALTHCHECK_TOKEN: ${{ secrets.TOTAL_ARC_HEALTHCHECK_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${TOTAL_ARC_HEALTHCHECK_TOKEN:-}" ]; then
            echo "::warning::TOTAL_ARC_HEALTHCHECK_TOKEN is not configured; bootstrap administrator provisioning was skipped."
            exit 0
          fi

          BASE_URL="${DEPLOYMENT_URL:-${FALLBACK_URL:-https://totalarc.elang-haqeem.workers.dev}}"
          BASE_URL="${BASE_URL%/}"
          URL="$BASE_URL/api/auth/bootstrap"

          success=false
          for attempt in $(seq 1 12); do
            HTTP_CODE="$(curl --silent --show-error --max-time 20 \
              --output /tmp/totalarc-auth-bootstrap.json \
              --write-out "%{http_code}" \
              --request POST \
              --header "X-Total-ARC-Health-Token: $TOTAL_ARC_HEALTHCHECK_TOKEN" \
              "$URL" || true)"

            if [ "$HTTP_CODE" = "200" ]; then
              success=true
              break
            fi

            echo "Bootstrap administrator provisioning not ready yet (HTTP ${HTTP_CODE:-unknown}, attempt $attempt/12)."
            sleep 5
          done

          if [ "$success" != "true" ]; then
            echo "::error::Bootstrap administrator could not be provisioned."
            cat /tmp/totalarc-auth-bootstrap.json 2>/dev/null || true
            exit 1
          fi

          STATUS="$(jq -r '.status // "unknown"' /tmp/totalarc-auth-bootstrap.json 2>/dev/null || echo unknown)"
          echo "Bootstrap administrator provisioning status: $STATUS"
          echo "### Authentication bootstrap" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bootstrap administrator: $STATUS" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production login rate-limit path
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          FALLBACK_URL: ${{ vars.TOTALARC_PRODUCTION_URL }}
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="${DEPLOYMENT_URL:-${FALLBACK_URL:-https://totalarc.elang-haqeem.workers.dev}}"
          BASE_URL="${BASE_URL%/}"
          PROBE_EMAIL="rate-limit-probe-${GITHUB_RUN_ID}@invalid.totalarc.test"
          PROBE_PASSWORD="Invalid-Probe-Only-9f4!Kp"

          HTTP_CODE="$(curl --silent --show-error --max-time 20             --output /tmp/totalarc-login-rate-limit-probe.json             --write-out "%{http_code}"             --request POST             --header "Content-Type: application/json"             --data "{\"email\":\"$PROBE_EMAIL\",\"password\":\"$PROBE_PASSWORD\"}"             "$BASE_URL/api/auth/login" || true)"

          if [ "$HTTP_CODE" = "503" ]; then
            echo "::error::Login endpoint returned HTTP 503. Rate-limit/auth runtime protection is unavailable."
            cat /tmp/totalarc-login-rate-limit-probe.json 2>/dev/null || true
            exit 1
          fi

          if [ "$HTTP_CODE" != "401" ] && [ "$HTTP_CODE" != "429" ]; then
            echo "::error::Unexpected login probe response HTTP $HTTP_CODE; expected 401 (invalid credential) or 429 (rate limited)."
            cat /tmp/totalarc-login-rate-limit-probe.json 2>/dev/null || true
            exit 1
          fi

          echo "### Authentication runtime verification" >> "$GITHUB_STEP_SUMMARY"
          echo "- Login endpoint: available" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rate-limit path: active / non-503" >> "$GITHUB_STEP_SUMMARY"
          echo "- Probe response: HTTP $HTTP_CODE" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify AI runtime and provider connectivity
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          FALLBACK_URL: ${{ vars.TOTALARC_PRODUCTION_URL }}
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="${DEPLOYMENT_URL:-${FALLBACK_URL:-}}"
          if [ -z "$BASE_URL" ]; then
            echo "::error::Deployment completed but no deployment URL was available."
            echo "Set repository variable TOTALARC_PRODUCTION_URL if Wrangler does not emit deployment-url." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          BASE_URL="${BASE_URL%/}"
          READY_URL="$BASE_URL/api/ai/ready"
          PROBE_URL="$BASE_URL/api/ai/probe"
          STATUS_URL="$BASE_URL/api/ai/status"

          ready=false
          for attempt in $(seq 1 12); do
            if body=$(curl --fail --silent --show-error --max-time 15 "$READY_URL"); then
              ready=$(printf '%s' "$body" | node -e "let i='';process.stdin.on('data',c=>i+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(i);process.stdout.write(j.ready===true?'true':'false')}catch{process.stdout.write('false')}})")
              if [ "$ready" = "true" ]; then break; fi
            fi
            echo "AI readiness not confirmed yet (attempt $attempt/12)."
            sleep 5
          done

          if [ "$ready" != "true" ]; then
            echo "::error::Cloudflare Workers AI binding did not become runtime-ready."
            exit 1
          fi

          probe_authorized=false
          for attempt in $(seq 1 12); do
            AUTH_HTTP=$(curl --silent --show-error --max-time 15 --output /tmp/totalarc-ai-probe-auth.json --write-out "%{http_code}"               -H "Authorization: Bearer $AI_PROBE_TOKEN" "$PROBE_URL")
            if [ "$AUTH_HTTP" -ge 200 ] && [ "$AUTH_HTTP" -lt 300 ]; then
              probe_authorized=true
              break
            fi

            if [ "$AUTH_HTTP" = "401" ] || [ "$AUTH_HTTP" = "503" ]; then
              echo "AI probe secret not active on the serving Worker yet (HTTP $AUTH_HTTP, attempt $attempt/12)."
              sleep 5
              continue
            fi

            echo "::error::AI probe authorization check failed unexpectedly (HTTP $AUTH_HTTP)."
            cat /tmp/totalarc-ai-probe-auth.json || true
            exit 1
          done

          if [ "$probe_authorized" != "true" ]; then
            echo "::error::AI probe secret did not propagate to the serving Worker within the verification window."
            exit 1
          fi

          probe_ready=false
          PROBE_HTTP=000
          probe=''

          for attempt in $(seq 1 12); do
            PROBE_HTTP=$(curl --silent --show-error --max-time 60 --output /tmp/totalarc-ai-probe.json --write-out "%{http_code}"               -X POST -H "Authorization: Bearer $AI_PROBE_TOKEN" "$PROBE_URL" || true)
            probe=$(cat /tmp/totalarc-ai-probe.json 2>/dev/null || true)
            private_ready=$(printf '%s' "$probe" | node -e "let i='';process.stdin.on('data',c=>i+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(i);process.stdout.write(j.privateProviderReady===true?'true':'false')}catch{process.stdout.write('false')}})")

            if [ "$PROBE_HTTP" -ge 200 ] && [ "$PROBE_HTTP" -lt 300 ] && [ "$private_ready" = "true" ]; then
              probe_ready=true
              break
            fi

            if [ "$PROBE_HTTP" = "401" ] || [ "$PROBE_HTTP" = "503" ]; then
              echo "AI inference probe belum konsisten di seluruh Worker (HTTP $PROBE_HTTP, percobaan $attempt/12)."
              sleep 5
              continue
            fi

            echo "AI inference probe belum siap (HTTP $PROBE_HTTP, percobaan $attempt/12)."
            sleep 5
          done

          if [ "$probe_ready" != "true" ]; then
            echo "::error::Cloudflare Workers AI tersedia, tetapi verifikasi inference privat belum stabil (HTTP $PROBE_HTTP)."
            exit 1
          fi

          provider_summary=$(printf '%s' "$probe" | node -e "let i='';process.stdin.on('data',c=>i+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(i);for(const p of j.providers||[]){console.log('- '+p.provider+': configured='+p.configured+', healthy='+p.ok+', model='+p.model+(p.error?(', error='+p.error):''))}}catch{console.log('- Probe response was not valid JSON')}})")

          echo "### AI production verification" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker deployment: successful" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workers AI binding: ready" >> "$GITHUB_STEP_SUMMARY"
          echo "- AI probe secret: propagated and authorized" >> "$GITHUB_STEP_SUMMARY"
          echo "$provider_summary"
          echo "$provider_summary" >> "$GITHUB_STEP_SUMMARY"

          external_healthy=$(printf '%s' "$probe" | node -e "let i='';process.stdin.on('data',c=>i+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(i);process.stdout.write(j.configuredExternalProvidersHealthy===true?'true':'false')}catch{process.stdout.write('false')}})")
          if [ "$external_healthy" != "true" ]; then
            echo "::warning::One or more configured external AI providers failed the production probe."
          fi

          status=$(curl --fail --silent --show-error --max-time 15 "$STATUS_URL")
          echo "- Private Workers AI inference: successful" >> "$GITHUB_STEP_SUMMARY"
          echo "Provider status endpoint responded successfully." >> "$GITHUB_STEP_SUMMARY"
