name: Deploy Total ARC to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: totalarc-production-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN."
            echo "### Deployment blocked" >> "$GITHUB_STEP_SUMMARY"
            echo "- Add repository secret CLOUDFLARE_API_TOKEN." >> "$GITHUB_STEP_SUMMARY"
            missing=1
          fi

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID."
            echo "### Cloudflare account ID required" >> "$GITHUB_STEP_SUMMARY"
            echo "- Add CLOUDFLARE_ACCOUNT_ID as a repository variable or repository secret." >> "$GITHUB_STEP_SUMMARY"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "Cloudflare deployment credentials are configured."

      - name: Validate Cloudflare Access authentication configuration
        env:
          TOTALARC_ACCESS_TEAM_DOMAIN: ${{ vars.TOTALARC_ACCESS_TEAM_DOMAIN }}
          TOTALARC_ACCESS_AUD: ${{ vars.TOTALARC_ACCESS_AUD }}
          TOTALARC_ADMIN_EMAIL: ${{ vars.TOTALARC_ADMIN_EMAIL }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          if [ -z "$TOTALARC_ACCESS_TEAM_DOMAIN" ]; then
            echo "::error::Missing repository variable TOTALARC_ACCESS_TEAM_DOMAIN."
            missing=1
          fi
          if [ -z "$TOTALARC_ACCESS_AUD" ]; then
            echo "::error::Missing repository variable TOTALARC_ACCESS_AUD."
            missing=1
          fi
          if [ -z "$TOTALARC_ADMIN_EMAIL" ]; then
            echo "::error::Missing repository variable TOTALARC_ADMIN_EMAIL."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "### Authentication deployment blocked" >> "$GITHUB_STEP_SUMMARY"
            echo "Configure Cloudflare Access team domain, application AUD, and bootstrap admin email before deploying this security stage." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if ! printf '%s' "$TOTALARC_ACCESS_TEAM_DOMAIN" | grep -Eq '^https://[^/]+\.cloudflareaccess\.com/?$'; then
            echo "::error::TOTALARC_ACCESS_TEAM_DOMAIN must be an https://<team>.cloudflareaccess.com URL."
            exit 1
          fi

          if ! printf '%s' "$TOTALARC_ADMIN_EMAIL" | grep -Eq '^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$'; then
            echo "::error::TOTALARC_ADMIN_EMAIL must be a valid email address."
            exit 1
          fi

          CERTS_URL="${TOTALARC_ACCESS_TEAM_DOMAIN%/}/cdn-cgi/access/certs"
          if ! curl --fail --silent --show-error --max-time 15 "$CERTS_URL" | jq -e '.keys | length > 0' >/dev/null; then
            echo "::error::Cloudflare Access signing keys could not be resolved from $CERTS_URL."
            exit 1
          fi

          echo "Cloudflare Access authentication configuration is structurally valid."

      - name: Audit optional external AI provider secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOTALARC_ACCESS_TEAM_DOMAIN: ${{ vars.TOTALARC_ACCESS_TEAM_DOMAIN }}
          TOTALARC_ACCESS_AUD: ${{ vars.TOTALARC_ACCESS_AUD }}
          TOTALARC_ADMIN_EMAIL: ${{ vars.TOTALARC_ADMIN_EMAIL }}
        shell: bash
        run: |
          set -euo pipefail
          echo "### AI provider configuration" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cloudflare Workers AI: required native binding" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$GEMINI_API_KEY" ]; then echo "- Gemini: configured in GitHub Actions" >> "$GITHUB_STEP_SUMMARY"; else echo "- Gemini: not configured" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -n "$GROQ_API_KEY" ]; then echo "- Groq: configured in GitHub Actions" >> "$GITHUB_STEP_SUMMARY"; else echo "- Groq: not configured" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -n "$OPENROUTER_API_KEY" ]; then echo "- OpenRouter: configured in GitHub Actions" >> "$GITHUB_STEP_SUMMARY"; else echo "- OpenRouter: not configured" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Validate D1 deployment permission
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if ! npx wrangler d1 list --json >/tmp/totalarc-d1-list.json 2>/tmp/totalarc-d1-error.log; then
            echo "::error::Cloudflare token cannot access D1. Total ARC cannot safely deploy its DB binding."
            echo "### Cloudflare D1 permission required" >> "$GITHUB_STEP_SUMMARY"
            echo "The deployment token is valid, but it cannot list/provision D1 databases." >> "$GITHUB_STEP_SUMMARY"
            echo "Grant D1 Edit/Write permission for the Total ARC Cloudflare account, then rerun this workflow." >> "$GITHUB_STEP_SUMMARY"
            tail -n 20 /tmp/totalarc-d1-error.log || true
            exit 1
          fi
          echo "Cloudflare D1 access is available."

      - name: Validate Workers AI account inference
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          MODEL="@cf/qwen/qwen3-30b-a3b-fp8"
          URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/run/$MODEL"
          HTTP_CODE=$(curl --silent --show-error --output /tmp/workers-ai-preflight.json --write-out "%{http_code}"             --request POST "$URL"             --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             --header "Content-Type: application/json"             --data '{"messages":[{"role":"user","content":"Reply with OK only."}],"max_tokens":16,"temperature":0}')

          SUCCESS=$(jq -r '.success // false' /tmp/workers-ai-preflight.json 2>/dev/null || echo false)
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ] || [ "$SUCCESS" != "true" ]; then
            echo "::error::Cloudflare Workers AI account inference preflight failed (HTTP $HTTP_CODE)."
            echo "### Workers AI account preflight failed" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.errors[]? | "- " + ((.code // "unknown")|tostring) + ": " + (.message // "Unknown Workers AI error")' /tmp/workers-ai-preflight.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            exit 1
          fi
          echo "Cloudflare Workers AI account inference is available."

      - name: Verify no dummy operational data
        run: npm run verify:no-dummy

      - name: Verify tenant isolation
        run: npm run verify:tenant-isolation

      - name: Verify mutation security
        run: npm run verify:mutation-security

      - name: Verify organization master integrity
        run: npm run verify:organization-integrity

      - name: Verify assurance persistence integrity
        run: npm run verify:assurance-integrity

      - name: Verify performance standards
        run: npm run verify:performance

      - name: Verify OJK regulatory reporting integrity
        run: npm run verify:reporting-integrity

      - name: Build OpenNext Worker
        run: npm run build

      - name: Deploy Worker and provision Cloudflare bindings
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Sync runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          put_secret() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" >/dev/null
              echo "$name synchronized to the Total ARC Worker."
            fi
          }

          AI_PROBE_TOKEN="$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$AI_PROBE_TOKEN"
          echo "AI_PROBE_TOKEN=$AI_PROBE_TOKEN" >> "$GITHUB_ENV"

          put_secret AI_PROBE_TOKEN "$AI_PROBE_TOKEN"
          put_secret GEMINI_API_KEY "$GEMINI_API_KEY"
          put_secret GROQ_API_KEY "$GROQ_API_KEY"
          put_secret OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
          put_secret TOTALARC_ACCESS_TEAM_DOMAIN "$TOTALARC_ACCESS_TEAM_DOMAIN"
          put_secret TOTALARC_ACCESS_AUD "$TOTALARC_ACCESS_AUD"
          put_secret TOTALARC_ADMIN_EMAIL "$TOTALARC_ADMIN_EMAIL"

      - name: Verify AI runtime and provider connectivity
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          FALLBACK_URL: ${{ vars.TOTALARC_PRODUCTION_URL }}
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="${DEPLOYMENT_URL:-${FALLBACK_URL:-}}"
          if [ -z "$BASE_URL" ]; then
            echo "::error::Deployment completed but no deployment URL was available."
            echo "Set repository variable TOTALARC_PRODUCTION_URL if Wrangler does not emit deployment-url." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          BASE_URL="${BASE_URL%/}"
          READY_URL="$BASE_URL/api/ai/ready"
          PROBE_URL="$BASE_URL/api/ai/probe"

          ready=false
          for attempt in $(seq 1 12); do
            if body=$(curl --fail --silent --show-error --max-time 15 "$READY_URL"); then
              ready=$(printf '%s' "$body" | node -e "let i='';process.stdin.on('data',c=>i+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(i);process.stdout.write(j.ready===true?'true':'false')}catch{process.stdout.write('false')}})")
              if [ "$ready" = "true" ]; then break; fi
            fi
            echo "AI readiness not confirmed yet (attempt $attempt/12)."
            sleep 5
          done

          if [ "$ready" != "true" ]; then
            echo "::error::Cloudflare Workers AI binding did not become runtime-ready."
            exit 1
          fi

          PROBE_HTTP=$(curl --silent --show-error --max-time 60 --output /tmp/totalarc-ai-probe.json --write-out "%{http_code}"             -X POST -H "Authorization: Bearer $AI_PROBE_TOKEN" "$PROBE_URL")
          probe=$(cat /tmp/totalarc-ai-probe.json)
          provider_summary=$(printf '%s' "$probe" | node -e "let i='';process.stdin.on('data',c=>i+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(i);for(const p of j.providers||[]){console.log('- '+p.provider+': configured='+p.configured+', healthy='+p.ok+', model='+p.model+(p.error?(', error='+p.error):''))}}catch{console.log('- Probe response was not valid JSON')}})")

          echo "### AI production verification" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker deployment: successful" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workers AI binding: ready" >> "$GITHUB_STEP_SUMMARY"
          echo "$provider_summary"
          echo "$provider_summary" >> "$GITHUB_STEP_SUMMARY"

          private_ready=$(printf '%s' "$probe" | node -e "let i='';process.stdin.on('data',c=>i+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(i);process.stdout.write(j.privateProviderReady===true?'true':'false')}catch{process.stdout.write('false')}})")
          if [ "$PROBE_HTTP" -lt 200 ] || [ "$PROBE_HTTP" -ge 300 ] || [ "$private_ready" != "true" ]; then
            echo "::error::Cloudflare Workers AI binding exists but private inference failed (HTTP $PROBE_HTTP)."
            exit 1
          fi

          external_healthy=$(printf '%s' "$probe" | node -e "let i='';process.stdin.on('data',c=>i+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(i);process.stdout.write(j.configuredExternalProvidersHealthy===true?'true':'false')}catch{process.stdout.write('false')}})")
          if [ "$external_healthy" != "true" ]; then
            echo "::warning::One or more configured external AI providers failed the production probe."
          fi

          echo "- Private Workers AI inference: successful" >> "$GITHUB_STEP_SUMMARY"
          echo "- Authenticated AI status endpoint is intentionally excluded from anonymous deployment probes." >> "$GITHUB_STEP_SUMMARY"
