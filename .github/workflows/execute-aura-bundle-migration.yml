name: Execute Aura encrypted bundle migration

on:
  push:
    branches: [main]
    paths:
      - 'secure-migration-aura/bundle.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Import Aura encrypted bundle
        env:
          TOTAL_ARC_HEALTHCHECK_TOKEN: ${{ secrets.TOTAL_ARC_HEALTHCHECK_TOKEN }}
          PRODUCTION_URL: ${{ vars.TOTALARC_PRODUCTION_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="secure-migration-aura/bundle.json"
          test -f "$BUNDLE"
          test "$(jq 'length' "$BUNDLE")" = "17"

          BASE_URL="${PRODUCTION_URL:-https://totalarc.elang-haqeem.workers.dev}"
          BASE_URL="${BASE_URL%/}"
          IMPORT_URL="$BASE_URL/api/system/source-migration"
          STATUS_URL="$BASE_URL/api/system/source-migration?op=status"

          total=0; ok=0; failed=0
          while IFS= read -r envelope; do
            total=$((total+1))
            code="$(curl --silent --show-error --max-time 180               --output /tmp/import.json --write-out "%{http_code}"               --request POST               --header "Content-Type: application/json"               --header "X-Total-ARC-Health-Token: $TOTAL_ARC_HEALTHCHECK_TOKEN"               --data-binary "$envelope" "$IMPORT_URL" || true)"
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ] && jq -e '.ok==true' /tmp/import.json >/dev/null 2>&1; then
              ok=$((ok+1))
              echo "Imported Aura remainder $total/17."
            else
              failed=$((failed+1))
              echo "::error::Aura remainder item $total failed (HTTP ${code:-unknown})."
              jq -c '{ok,code}' /tmp/import.json 2>/dev/null || true
            fi
          done < <(jq -c '.[]' "$BUNDLE")

          echo "Aura remainder migration: total=$total ok=$ok failed=$failed"
          test "$ok" = "17"
          test "$failed" = "0"

          curl --fail --silent --show-error --max-time 30             --header "X-Total-ARC-Health-Token: $TOTAL_ARC_HEALTHCHECK_TOKEN"             "$STATUS_URL" > /tmp/status.json
          docs="$(jq -r '.metrics.documents // 0' /tmp/status.json)"
          archives="$(jq -r '.metrics.archiveMembers // 0' /tmp/status.json)"
          roots=$((docs-archives))
          raw="$(jq -r '.metrics.documentsWithRawBytes // 0' /tmp/status.json)"
          indexed="$(jq -r '.metrics.documentsWithIndexedText // 0' /tmp/status.json)"
          echo "Source Library metrics: documents=$docs rootFiles=$roots archiveMembers=$archives raw=$raw indexed=$indexed"
          test "$docs" -ge 65
          test "$roots" -ge 44
          test "$archives" -ge 21
          test "$raw" -ge 39

          npx wrangler d1 list --json > /tmp/d1.json
          DB_NAME="$(jq -r '(map(select((.name|ascii_downcase|contains("totalarc")) or (.name|ascii_downcase|contains("total-arc")))) | .[0].name) // (if length == 1 then .[0].name else empty end)' /tmp/d1.json)"
          test -n "$DB_NAME"
          npx wrangler d1 execute "$DB_NAME" --remote --json --command "
            SELECT
              json_extract(metadataJson,'$.sourceAccount') AS sourceAccount,
              json_extract(metadataJson,'$.sourceRole') AS sourceRole,
              json_extract(metadataJson,'$.precedencePriority') AS priority,
              COUNT(*) AS records
            FROM SourceDocument
            WHERE status='Active'
            GROUP BY sourceAccount, sourceRole, priority
            ORDER BY priority;
          " > /tmp/provenance.json

          aura="$(jq -r '[.[0].results[] | select(.sourceAccount=="aurakasih6987@gmail.com" and .sourceRole=="BASELINE" and .priority==10) | .records] | add // 0' /tmp/provenance.json)"
          seraya="$(jq -r '[.[0].results[] | select(.sourceAccount=="serayamg@gmail.com" and .sourceRole=="UPDATE" and .priority==20) | .records] | add // 0' /tmp/provenance.json)"
          echo "Provenance verified: Aura baseline=$aura; Seraya update=$seraya"
          test "$aura" = "22"
          test "$seraya" = "43"

          cleanup="$(curl --silent --show-error --max-time 30             --request POST             --header "Content-Type: application/json"             --header "X-Total-ARC-Health-Token: $TOTAL_ARC_HEALTHCHECK_TOKEN"             --data '{"op":"cleanup"}' "$IMPORT_URL")"
          printf '%s' "$cleanup" | jq -e '.ok==true and .cleaned==true' >/dev/null
          echo "Aura baseline completion verified; temporary migration key removed."
