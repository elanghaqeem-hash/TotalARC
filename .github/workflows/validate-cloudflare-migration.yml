name: Validate Cloudflare build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile for security override
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts
          echo "LOCKFILE_BASE64_BEGIN"
          base64 -w0 package-lock.json
          echo
          echo "LOCKFILE_BASE64_END"

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit diagnostics
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
          console.log(JSON.stringify({
            metadata: report.metadata,
            vulnerabilities: report.vulnerabilities
          }, null, 2));
          NODE

      - name: Verify no dummy operational data
        run: npm run verify:no-dummy

      - name: Build OpenNext Cloudflare artifact
        run: npm run build

      - name: Verify Worker artifact exists
        run: test -f .open-next/worker.js
