name: Validate Cloudflare build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Verify no dummy operational data
        run: npm run verify:no-dummy

      - name: Build OpenNext Cloudflare artifact
        run: npm run build

      - name: Verify Worker artifact exists
        run: test -f .open-next/worker.js
