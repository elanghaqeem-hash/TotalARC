name: Validate Cloudflare build

on:
  pull_request:
    branches:
      - main
      - database/formal-d1-migrations-stage4

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce dependency security gate
        run: npm audit --audit-level=moderate

      - name: Verify no dummy operational data
        run: npm run verify:no-dummy

      - name: Verify tenant isolation
        run: npm run verify:tenant-isolation

      - name: Verify mutation security
        run: npm run verify:mutation-security

      - name: Verify organization master integrity
        run: npm run verify:organization-integrity

      - name: Verify assurance persistence integrity
        run: npm run verify:assurance-integrity

      - name: Verify performance standards
        run: npm run verify:performance

      - name: Build OpenNext Cloudflare artifact
        run: npm run build

      - name: Verify Worker artifact exists
        run: test -f .open-next/worker.js
