name: Validate Cloudflare build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - hardening/production-readiness

permissions:
  contents: read

concurrency:
  group: totalarc-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused
      AI_ALLOW_EXTERNAL: "false"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Reconcile lockfile for validation
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Build OpenNext Cloudflare artifact
        run: npm run build:cloudflare

      - name: Verify Worker artifact exists
        run: test -f .open-next/worker.js

      - name: Verify Wrangler can package Worker
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
