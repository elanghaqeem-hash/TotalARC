name: Validate Cloudflare build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce production dependency security gate
        run: npm audit --omit=dev --audit-level=moderate

      - name: Enforce critical toolchain security gate
        run: npm audit --audit-level=critical

      - name: Verify no dummy operational data
        run: npm run verify:no-dummy

      - name: Verify sidebar module integrity
        run: npm run verify:modules

      - name: Verify authentication security integrity
        run: npm run verify:auth-security

      - name: Verify D1 schema stability
        run: npm run verify:d1-schema-stability

      - name: Verify tenant isolation
        run: npm run verify:tenant-isolation

      - name: Verify RCM integrity
        run: npm run verify:rcm-integrity

      - name: Verify AI security
        run: npm run verify:ai-security

      - name: Verify ICOFR traceability integrity
        run: npm run verify:icofr-traceability

      - name: Verify TypeScript
        run: npm run typecheck

      - name: Build Next.js application
        run: npm run build:next

      - name: Build OpenNext Cloudflare artifact
        run: npm run build

      - name: Verify Worker artifact exists
        run: test -f .open-next/worker.js
