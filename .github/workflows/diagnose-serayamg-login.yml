name: Diagnose serayamg login

on:
  push:
    branches:
      - ops/diagnose-serayamg-login-20260923
    paths:
      - '.github/workflows/diagnose-serayamg-login.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Inspect target AuthUser state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1-list.json
          DB_NAME="$(jq -r '
            (map(select((.name|ascii_downcase|contains("totalarc")) or (.name|ascii_downcase|contains("total-arc")))) | .[0].name) //
            (if length == 1 then .[0].name else empty end)
          ' /tmp/d1-list.json)"

          if [ -z "$DB_NAME" ]; then
            echo "::error::Could not identify Total ARC D1 database."
            exit 1
          fi

          npx wrangler d1 execute "$DB_NAME" --remote --json --command "
            SELECT
              id,
              institutionId,
              orgUnitId,
              name,
              email,
              emailNormalized,
              role,
              department,
              active,
              mustChangePassword,
              failedLoginCount,
              lockedUntil,
              lastLoginAt,
              credentialResetAt,
              temporaryCredentialExpiresAt,
              passwordIterations,
              createdAt,
              updatedAt
            FROM AuthUser
            WHERE emailNormalized='serayamg@gmail.com'
            LIMIT 1;
          " > /tmp/user.json

          COUNT="$(jq -r '.[0].results | length' /tmp/user.json)"
          echo "matchingUsers=$COUNT"
          if [ "$COUNT" != "1" ]; then
            cat /tmp/user.json
            exit 1
          fi

          jq '.[0].results[0]' /tmp/user.json
