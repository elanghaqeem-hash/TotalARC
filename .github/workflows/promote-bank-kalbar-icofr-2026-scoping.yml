name: Promote Bank Kalbar ICOFR 2026 scoping

on:
  push:
    branches: [main]
    paths:
      - 'scripts/promote-bank-kalbar-icofr-2026-scoping.py'
      - 'data/bank-kalbar-icofr-scoping-2026-meta.json'
      - 'data/bank-kalbar-icofr-scoping-2026-data.json.gz.b64'
      - 'src/lib/d1-icofr.ts'
      - 'src/app/icofr/scoping/page.tsx'
      - '.github/workflows/promote-bank-kalbar-icofr-2026-scoping.yml'
      - '.github/workflows/verify-production-d1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: totalarc-bank-kalbar-icofr-2026-scoping
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Promote source-governed FY2026 ICOFR scoping to production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/promote-bank-kalbar-icofr-2026-scoping.py

      - name: Verify production ICOFR scoping API
        env:
          TOTAL_ARC_HEALTHCHECK_TOKEN: ${{ secrets.TOTAL_ARC_HEALTHCHECK_TOKEN }}
          TOTALARC_PRODUCTION_URL: ${{ vars.TOTALARC_PRODUCTION_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TOTAL_ARC_HEALTHCHECK_TOKEN:-}" ]; then
            echo "::error::TOTAL_ARC_HEALTHCHECK_TOKEN is required for production verification."
            exit 1
          fi

          BASE_URL="${TOTALARC_PRODUCTION_URL:-https://totalarc.elang-haqeem.workers.dev}"
          BASE_URL="${BASE_URL%/}"

          check_json() {
            local name="$1"
            local path="$2"
            local expression="$3"
            local output="/tmp/totalarc-${name}.json"
            local code
            code="$(curl --silent --show-error --location --max-time 30 \
              --output "$output" --write-out "%{http_code}" \
              --header "X-Total-ARC-Health-Token: $TOTAL_ARC_HEALTHCHECK_TOKEN" \
              "$BASE_URL$path" || true)"
            if [ "$code" != "200" ]; then
              echo "::error::$name returned HTTP ${code:-unknown}."
              cat "$output" 2>/dev/null || true
              return 1
            fi
            if ! jq -e "$expression" "$output" >/dev/null 2>&1; then
              echo "::error::$name returned an unexpected payload."
              cat "$output" 2>/dev/null || true
              return 1
            fi
            echo "$name: healthy"
          }

          check_json "icofr-scoping" "/api/icofr/scoping" '
            .storage == "cloudflare-d1" and
            ([.scopes[] | select(
              .fiscalYear == 2026 and
              .scopeName == "Bank Kalbar ICOFR Tahun Buku 2026" and
              .benchmarkType == "Profit Before Tax - normalized 3-year average" and
              .benchmarkAmount == 638098666667 and
              .overallMaterialityPercent == 5 and
              .overallMaterialityAmount == 31904933333 and
              .performanceMaterialityPercent == 50 and
              .performanceMaterialityAmount == 15952466667 and
              .clearlyTrivialPercent == 5 and
              .clearlyTrivialAmount == 797623333 and
              .status == "Under Review" and
              ([.parameters[] | select(.parameterCode == "OM_AMOUNT" and .status == "UNDER_REVIEW_DRAFT_WORKPAPER")] | length) == 1 and
              ([.parameters[] | select(.parameterCode == "REQUEST_TRACKER_OM_ALTERNATE" and .numericValue == 33669050000 and .status == "SOURCE_CONFLICT_NOT_ACTIVE")] | length) == 1 and
              ([.populationSummaries[] | select(
                .populationType == "FSLI" and
                .assessedCount == 52 and
                .significantCount == 37 and
                .quantitativeSignificantCount == 36 and
                .qualitativeOnlyCount == 1 and
                .notSignificantCount == 14 and
                .sourceStatus == "COMPLETE_SOURCE_ENUMERATION"
              )] | length) == 1 and
              ([.populationSummaries[] | select(
                .populationType == "BUSINESS_PROCESS" and
                .assessedCount == 16 and
                .significantCount == 16 and
                .sourceStatus == "COMPLETE_SOURCE_ENUMERATION"
              )] | length) == 1 and
              ([.populationSummaries[] | select(
                .populationType == "APPLICATION" and
                .assessedCount == 62 and
                .significantCount == 31 and
                .notSignificantCount == 31 and
                .sourceStatus == "REVALIDATION_REQUIRED"
              )] | length) == 1 and
              ([.items[] | select(.itemType == "Financial Account")] | length) == 52 and
              ([.items[] | select(.itemType == "Financial Account" and .inScope == true)] | length) == 38 and
              ([.items[] | select(.itemType == "Business Process")] | length) == 16 and
              ([.items[] | select(.itemType == "Business Process" and .inScope == true)] | length) == 16 and
              ([.items[] | select(.itemType == "IT System")] | length) == 62 and
              ([.items[] | select(.itemType == "IT System" and .sourceMetadata.sourceConclusion == "Signifikan")] | length) == 31 and
              ([.items[] | select(.code == "SC-ELC" and .inScope == true)] | length) == 1 and
              ([.items[] | select(.code == "SC-CUSTOMER-SERVICE")] | length) == 0 and
              ([.issues[] | select(.status == "OPEN")] | length) == 6 and
              ([.issues[] | select(.issueCode == "FSLI-BORDERLINE" and .status == "OPEN")] | length) == 1 and
              ([.issues[] | select(.issueCode == "CSA-ILLUSTRATIVE-NOT-SOURCE" and .status == "CLOSED")] | length) == 1 and
              ([.links[] | select(.relationType == "FSLI_TO_PROCESS")] | length) > 0 and
              ([.links[] | select(.relationType == "FSLI_TO_APPLICATION")] | length) > 0
            )] | length) == 1
          '

          check_json "icofr-financial-items" "/api/icofr/financial-items" '
            .storage == "cloudflare-d1" and
            ([.records[] | select(.itemCode | startswith("FSLI-"))] | length) == 52 and
            ([.records[] | select((.itemCode | startswith("FSLI-")) and .significant == true)] | length) == 37 and
            ([.records[] | select(.itemCode == "FSLI-NR-36" and .significant == false and .status == "Under Review - Borderline")] | length) == 1 and
            ([.records[] | select(.itemCode == "FSLI-NR-07" and .balanceAmount == 289920000000)] | length) == 1 and
            ([.records[] | select(.itemCode == "FSLI-LR-05" and .balanceAmount == 102040000000)] | length) == 1
          '
