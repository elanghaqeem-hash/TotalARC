name: Reparent Bank Kalbar branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reparent-bank-kalbar-branches.yml'
      - '.github/workflows/promote-bank-kalbar-deep-organization.yml'
      - 'scripts/promote-bank-kalbar-complete-org.py'
      - 'src/lib/d1-organization.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: totalarc-reparent-bank-kalbar-branches
  cancel-in-progress: true

jobs:
  reparent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Put all Bank Kalbar branches under Direktur Pemasaran & UUS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, subprocess, tempfile
          from datetime import datetime, timezone

          LEGAL_NAME = "PT. Bank Pembangunan Daerah Kalimantan Barat"
          PARENT_CODE = "DIR-PEMASARAN-UUS"

          def wr(args):
              p = subprocess.run(["npx", "wrangler", *args], text=True, env=os.environ, capture_output=True)
              if p.returncode != 0:
                  print(p.stdout[-4000:])
                  print(p.stderr[-4000:])
                  raise RuntimeError("WRANGLER_COMMAND_FAILED")
              return p.stdout

          def q(v):
              return "'" + str(v).replace("'", "''") + "'"

          dbs = json.loads(wr(["d1", "list", "--json"]))
          db = next((x for x in dbs if re.search(r"total.?arc", x["name"], re.I)), None)
          if not db:
              db = dbs[0] if len(dbs) == 1 else None
          if not db:
              raise RuntimeError("TOTAL_ARC_D1_NOT_FOUND")
          DB = db["name"]

          def rows(sql):
              raw = json.loads(wr(["d1", "execute", DB, "--remote", "--json", "--command", sql]))
              raw = raw if isinstance(raw, list) else [raw]
              return [r for block in raw for r in (block.get("results") or [])]

          inst = rows("SELECT id FROM Institution WHERE legalName="+q(LEGAL_NAME)+" LIMIT 1")
          if len(inst) != 1:
              raise RuntimeError("BANK_KALBAR_INSTITUTION_NOT_FOUND")
          institution_id = str(inst[0]["id"])

          parent = rows(
              "SELECT id,name FROM OrganizationUnit WHERE institutionId="+q(institution_id)+
              " AND code="+q(PARENT_CODE)+" LIMIT 1"
          )
          if len(parent) != 1:
              raise RuntimeError("DIRECTOR_PEMASARAN_UUS_NOT_FOUND")
          parent_id = str(parent[0]["id"])

          branches = rows(
              "SELECT id,code,name,parentId FROM OrganizationUnit WHERE institutionId="+q(institution_id)+
              " AND (type='Branch' OR code LIKE 'BR-%') ORDER BY code"
          )
          if not branches:
              raise RuntimeError("NO_BANK_KALBAR_BRANCHES_FOUND")

          now = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          branch_ids = ",".join(q(str(x["id"])) for x in branches)
          sql = (
              "UPDATE OrganizationUnit SET parentId="+q(parent_id)+",updatedAt="+q(now)+
              " WHERE institutionId="+q(institution_id)+" AND id IN ("+branch_ids+");"
          )
          with tempfile.NamedTemporaryFile("w", suffix=".sql", delete=False) as fh:
              fh.write(sql)
              sql_path = fh.name
          wr(["d1", "execute", DB, "--remote", "--file", sql_path])

          check = rows(
              "SELECT c.code,c.name,p.code AS parentCode,p.name AS parentName "
              "FROM OrganizationUnit c LEFT JOIN OrganizationUnit p ON p.id=c.parentId "
              "WHERE c.institutionId="+q(institution_id)+
              " AND (c.type='Branch' OR c.code LIKE 'BR-%') ORDER BY c.code"
          )
          mismatches = [x for x in check if x.get("parentCode") != PARENT_CODE]

          print(json.dumps({
              "institution": LEGAL_NAME,
              "targetParentCode": PARENT_CODE,
              "targetParentName": parent[0]["name"],
              "branchCount": len(check),
              "mismatchCount": len(mismatches),
              "branches": check,
          }, indent=2, ensure_ascii=False))

          if mismatches:
              raise RuntimeError("BRANCH_PARENT_MISMATCH_"+str(len(mismatches)))
          PY
