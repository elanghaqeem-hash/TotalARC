name: Production Readiness

on:
  push:
    branches:
      - hardening/production-readiness
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: totalarc-production-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: totalarc
          POSTGRES_PASSWORD: totalarc
          POSTGRES_DB: totalarc_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U totalarc -d totalarc_validation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://totalarc:totalarc@localhost:5432/totalarc_validation
      SESSION_SECRET: ci-only-session-secret-please-replace-in-production-0123456789abcdef
      PLATFORM_ADMIN_EMAILS: admin@example.com
      AI_ALLOW_EXTERNAL: "false"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Reconcile lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Persist reconciled lockfile
        if: github.event_name == 'push'
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json || [ -n "$(git status --porcelain package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: regenerate npm lockfile [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply schema to ephemeral PostgreSQL
        run: npx prisma db push --skip-generate

      - name: Seed reference data only
        run: npm run db:seed

      - name: Verify database connectivity and no demo transactions
        run: node scripts/verify-database.mjs

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high
