name: Cleanup Total ARC Hostinger export
# Final cleanup after export retrieval

on:
  push:
    branches:
      - ops/hostinger-d1-export-20261004-1614
    paths:
      - '.github/workflows/cleanup-hostinger-d1-export.yml'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete temporary database artifacts
        shell: bash
        run: |
          set -euo pipefail
          IDS="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --paginate --jq '.artifacts[] | select(.name=="totalarc-d1-hostinger-export") | .id')"
          if [ -z "$IDS" ]; then
            echo "No temporary Total ARC database artifacts remain."
            exit 0
          fi
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            echo "Deleted temporary artifact $id"
          done <<< "$IDS"
