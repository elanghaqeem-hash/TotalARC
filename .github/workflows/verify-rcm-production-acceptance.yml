name: Verify RCM production acceptance

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/d1-core.ts'
      - 'src/app/api/system/rcm-integrity/route.ts'
      - 'scripts/harden-bank-kalbar-rcm-2026.py'
      - 'scripts/verify-rcm-integrity.js'
      - '.github/workflows/verify-rcm-production-acceptance.yml'
  workflow_run:
    workflows: ['Deploy Total ARC to Cloudflare']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: totalarc-rcm-production-acceptance
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      TOTALARC_PRODUCTION_URL: ${{ vars.TOTALARC_PRODUCTION_URL }}
      TOTAL_ARC_HEALTHCHECK_TOKEN: ${{ secrets.TOTAL_ARC_HEALTHCHECK_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Verify exact production D1 acceptance counts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, subprocess

          EXPECTED = {
              "controls": 132,
              "uusControls": 42,
              "itgcControls": 10,
              "ckpnRequirements": 9,
              "reverseRepoRequirements": 1,
              "elcDraftReferences": 63,
              "integrity": "PASS",
          }
          LEGAL_NAME = "PT. Bank Pembangunan Daerah Kalimantan Barat"

          def wr(args):
              p = subprocess.run(
                  ["npx", "wrangler", *args],
                  text=True,
                  env=os.environ,
                  capture_output=True,
              )
              if p.returncode != 0:
                  print(p.stdout[-4000:])
                  print(p.stderr[-4000:])
                  raise RuntimeError("WRANGLER_COMMAND_FAILED")
              return p.stdout

          dbs = json.loads(wr(["d1", "list", "--json"]))
          db = next((x for x in dbs if re.search(r"total.?arc", x["name"], re.I)), None)
          if not db:
              db = dbs[0] if len(dbs) == 1 else None
          if not db:
              raise RuntimeError("TOTAL_ARC_D1_NOT_FOUND")
          DB = db["name"]

          def rows(sql):
              raw = json.loads(
                  wr(["d1", "execute", DB, "--remote", "--json", "--command", sql])
              )
              raw = raw if isinstance(raw, list) else [raw]
              return [r for block in raw for r in (block.get("results") or [])]

          def q(value):
              return "'" + str(value).replace("'", "''") + "'"

          def scalar(sql):
              data = rows(sql)
              return int((data[0] if data else {}).get("count") or 0)

          institutions = rows(
              "SELECT id,name,legalName FROM Institution "
              "WHERE legalName=" + q(LEGAL_NAME) + " LIMIT 2"
          )
          if len(institutions) != 1:
              raise RuntimeError("BANK_KALBAR_INSTITUTION_COUNT_" + str(len(institutions)))
          institution = institutions[0]
          iid = str(institution["id"])

          required_tables = {
              "ControlMaster",
              "RCMControlSourceMetadata",
              "RCMDesignRequirement",
              "RCMDraftReference",
              "RCMIntegrityRun",
          }
          existing_tables = {
              str(r["name"])
              for r in rows("SELECT name FROM sqlite_master WHERE type='table'")
          }
          missing = sorted(required_tables - existing_tables)
          if missing:
              raise RuntimeError("MISSING_RCM_TABLES_" + ",".join(missing))

          latest = rows(
              "SELECT id,batchCode,runAt,status,summaryJson "
              "FROM RCMIntegrityRun WHERE institutionId=" + q(iid) +
              " ORDER BY runAt DESC LIMIT 1"
          )
          latest = latest[0] if latest else None

          actual = {
              "controls": scalar(
                  "SELECT COUNT(*) AS count FROM ControlMaster WHERE institutionId=" + q(iid)
              ),
              "uusControls": scalar(
                  "SELECT COUNT(DISTINCT c.id) AS count "
                  "FROM ControlMaster c "
                  "JOIN RCMControlSourceMetadata sm ON sm.controlId=c.id "
                  "WHERE c.institutionId=" + q(iid) +
                  " AND sm.institutionId=" + q(iid) +
                  " AND sm.sourceCycle='SYH'"
              ),
              "itgcControls": scalar(
                  "SELECT COUNT(*) AS count FROM ControlMaster "
                  "WHERE institutionId=" + q(iid) + " AND isItgc=1"
              ),
              "ckpnRequirements": scalar(
                  "SELECT COUNT(*) AS count FROM RCMDesignRequirement "
                  "WHERE institutionId=" + q(iid) + " AND category='CKPN'"
              ),
              "reverseRepoRequirements": scalar(
                  "SELECT COUNT(*) AS count FROM RCMDesignRequirement "
                  "WHERE institutionId=" + q(iid) + " AND category='Reverse Repo'"
              ),
              "elcDraftReferences": scalar(
                  "SELECT COUNT(*) AS count FROM RCMDraftReference "
                  "WHERE institutionId=" + q(iid) +
                  " AND sourceStatus='ILLUSTRATIVE_DRAFT' "
                  "AND referenceType IN "
                  "('ELC_PRINCIPLE_TEMPLATE_REFERENCE','ELC_BPM_NARRATIVE_REFERENCE')"
              ),
              "integrity": str((latest or {}).get("status") or "PENDING"),
          }

          # Verify original 132-control snapshot and all subsequently added
          # control records. The live total remains available unchanged.
          cutoff = str((latest or {}).get("runAt") or "")
          actual["baselineControls"] = scalar(
              "SELECT COUNT(*) AS count FROM ControlMaster WHERE institutionId=" + q(iid) +
              " AND createdAt <= " + q(cutoff)
          ) if cutoff else 0
          actual["validatedSupplementaryControls"] = scalar(
              "SELECT COUNT(DISTINCT c.id) AS count FROM ControlMaster c "
              "JOIN RCMControlSourceMetadata sm ON sm.controlId=c.id AND sm.institutionId=c.institutionId "
              "WHERE c.institutionId=" + q(iid) +
              " AND c.createdAt > " + q(cutoff) +
              " AND c.status='Active' AND sm.sourceRecordType='BPM_DERIVED_USER_VALIDATED' "
              "AND sm.validationStatus='USER_VALIDATED'"
          ) if cutoff else 0
          # No record is silently removed or treated as compliant without validation.
          actual["unvalidatedSupplementaryControls"] = max(
              0, actual["controls"] - actual["baselineControls"] - actual["validatedSupplementaryControls"]
          )

          # Read-only drift evidence: do not delete controls or relax acceptance.
          control_drift = {}
          if actual["controls"] != EXPECTED["controls"]:
              control_drift = {
                  "delta": actual["controls"] - EXPECTED["controls"],
                  "withoutSourceMetadata": rows(
                      "SELECT c.id,c.controlId FROM ControlMaster c "
                      "WHERE c.institutionId=" + q(iid) +
                      " AND NOT EXISTS (SELECT 1 FROM RCMControlSourceMetadata sm "
                      "WHERE sm.controlId=c.id AND sm.institutionId=c.institutionId) "
                      "ORDER BY c.id LIMIT 50"
                  ),
                  "baselineBatchChangedControls": rows(
                  "SELECT c.controlId,c.status,sm.sourceRecordType,sm.validationStatus,"
                  "c.createdAt,c.updatedAt FROM ControlMaster c "
                  "JOIN RCMControlSourceMetadata sm ON sm.controlId=c.id AND sm.institutionId=c.institutionId "
                  "WHERE c.institutionId=" + q(iid) +
                  (" AND c.createdAt > " + q(str(latest.get('runAt'))) if latest and latest.get('runAt') else "") +
                  " ORDER BY c.createdAt DESC LIMIT 20"
              ),
              "controlsByLifecycleStatus": rows(
                  "SELECT status,COUNT(*) AS count FROM ControlMaster WHERE institutionId=" + q(iid) +
                  " GROUP BY status ORDER BY status"
              ),
              "duplicateControlCodes": rows(
                      "SELECT controlId,COUNT(*) AS count FROM ControlMaster "
                      "WHERE institutionId=" + q(iid) +
                      " GROUP BY controlId HAVING COUNT(*)>1 ORDER BY controlId LIMIT 50"
                  ),
              }

          pass_all = (
              actual["baselineControls"] == EXPECTED["controls"]
              and actual["controls"] >= actual["baselineControls"]
              and actual["unvalidatedSupplementaryControls"] == 0
              and all(actual[key] == expected for key, expected in EXPECTED.items() if key != "controls")
          )
          latest_summary = {}
          if latest:
              try:
                  latest_summary = json.loads(str(latest.get("summaryJson") or "{}"))
              except Exception:
                  latest_summary = {"parseError": True}

          evidence = {
              "test": "RCM_PRODUCTION_ACCEPTANCE",
              "database": DB,
              "institution": institution,
              "expected": EXPECTED,
              "actual": actual,
              "controlDrift": control_drift,
              "acceptanceBasis": "2026_SOURCE_VALIDATED_BASELINE_PLUS_USER_VALIDATED_CONTROLS",
              "latestIntegrityRun": {
                  "id": latest.get("id") if latest else None,
                  "batchCode": latest.get("batchCode") if latest else None,
                  "runAt": latest.get("runAt") if latest else None,
                  "status": latest.get("status") if latest else None,
                  "summary": latest_summary,
              },
              "status": "PASS" if pass_all else "FAIL",
          }
          print(json.dumps(evidence, indent=2, ensure_ascii=False))
          with open("/tmp/rcm-production-acceptance.json", "w", encoding="utf-8") as fh:
              json.dump(evidence, fh, indent=2, ensure_ascii=False)

          if not pass_all:
              raise RuntimeError("RCM_PRODUCTION_ACCEPTANCE_FAILED")
          PY

      - name: Verify runtime production integrity endpoint
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TOTAL_ARC_HEALTHCHECK_TOKEN:-}" ]; then
            echo "::error::TOTAL_ARC_HEALTHCHECK_TOKEN is required for runtime verification."
            exit 1
          fi

          BASE_URL="${TOTALARC_PRODUCTION_URL:-https://totalarc.elang-haqeem.workers.dev}"
          BASE_URL="${BASE_URL%/}"
          OUT=/tmp/rcm-runtime-integrity.json

          healthy=false
          for attempt in $(seq 1 12); do
            code="$(curl --silent --show-error --location --max-time 25               --output "$OUT"               --write-out "%{http_code}"               --header "X-Total-ARC-Health-Token: $TOTAL_ARC_HEALTHCHECK_TOKEN"               "$BASE_URL/api/system/rcm-integrity" || true)"

            if [ "$code" = "200" ] && jq -e '
              .ok == true and
              .test == "RCM_PRODUCTION_INTEGRITY" and
              .storage == "cloudflare-d1" and
              .summary.baselineControls == 132 and
              .summary.controls >= .summary.baselineControls and
              .summary.validatedSupplementaryControls == (.summary.controls - .summary.baselineControls) and
              .summary.uusControls == 42 and
              .summary.itgcControls == 10 and
              .summary.ckpnRequirements == 9 and
              .summary.reverseRepoRequirements == 1 and
              .summary.elcDraftReferences == 63 and
              .summary.integrity == "PASS"
            ' "$OUT" >/dev/null 2>&1; then
              healthy=true
              break
            fi

            echo "RCM runtime endpoint not converged yet (attempt $attempt/12, HTTP ${code:-unknown})."
            sleep 5
          done

          cat "$OUT" | jq . || true
          if [ "$healthy" != "true" ]; then
            echo "::error::RCM runtime production acceptance verification failed."
            exit 1
          fi

          echo "Runtime endpoint independently confirms exact RCM production acceptance."
          echo "- Runtime API: PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish acceptance evidence
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/rcm-production-acceptance.json ]; then
            echo "## RCM Production Acceptance" >> "$GITHUB_STEP_SUMMARY"
            jq -r '
              "- Status: **" + .status + "**",
              "- Database: " + .database,
              "- Institution: " + .institution.legalName,
              "",
              "| Acceptance | Expected | Actual |",
              "|---|---:|---:|",
              "| 2026 baseline controls | " + (.expected.controls|tostring) + " | " + (.actual.baselineControls|tostring) + " |",
              "| Live total controls (not hidden) | — | " + (.actual.controls|tostring) + " |",
              "| Separately validated additions | All | " + (.actual.validatedSupplementaryControls|tostring) + " |",
              "| Unvalidated additions | 0 | " + (.actual.unvalidatedSupplementaryControls|tostring) + " |",
              "| UUS | " + (.expected.uusControls|tostring) + " | " + (.actual.uusControls|tostring) + " |",
              "| ITGC | " + (.expected.itgcControls|tostring) + " | " + (.actual.itgcControls|tostring) + " |",
              "| CKPN | " + (.expected.ckpnRequirements|tostring) + " | " + (.actual.ckpnRequirements|tostring) + " |",
              "| Reverse Repo | " + (.expected.reverseRepoRequirements|tostring) + " | " + (.actual.reverseRepoRequirements|tostring) + " |",
              "| ELC draft references | " + (.expected.elcDraftReferences|tostring) + " | " + (.actual.elcDraftReferences|tostring) + " |",
              "| Integrity | " + .expected.integrity + " | " + .actual.integrity + " |"
            ' /tmp/rcm-production-acceptance.json >> "$GITHUB_STEP_SUMMARY"
          fi
