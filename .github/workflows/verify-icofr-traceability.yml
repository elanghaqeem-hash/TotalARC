name: Verify ICOFR traceability

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/d1-icofr-integrity.ts'
      - 'src/lib/d1-icofr-traceability.ts'
      - 'src/lib/d1-icofr-certification.ts'
      - 'src/lib/d1-icofr-domains.ts'
      - 'scripts/verify-icofr-lifecycle-traceability.js'
      - 'package.json'
      - '.github/workflows/verify-icofr-traceability.yml'
  pull_request:
    paths:
      - 'src/lib/d1-icofr-integrity.ts'
      - 'src/lib/d1-icofr-traceability.ts'
      - 'src/lib/d1-icofr-certification.ts'
      - 'src/lib/d1-icofr-domains.ts'
      - 'scripts/verify-icofr-lifecycle-traceability.js'
      - 'package.json'
      - '.github/workflows/verify-icofr-traceability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  traceability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify:icofr-traceability
