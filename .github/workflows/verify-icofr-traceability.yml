name: Verify ICOFR traceability

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/d1-icofr-integrity.ts'
      - 'src/lib/d1-icofr-traceability.ts'
      - 'src/lib/d1-icofr-certification.ts'
      - 'src/lib/d1-icofr-domains.ts'
      - 'scripts/verify-icofr-lifecycle-traceability.js'
      - 'package.json'
      - '.github/workflows/verify-icofr-traceability.yml'
  pull_request:
    paths:
      - 'src/lib/d1-icofr-integrity.ts'
      - 'src/lib/d1-icofr-traceability.ts'
      - 'src/lib/d1-icofr-certification.ts'
      - 'src/lib/d1-icofr-domains.ts'
      - 'scripts/verify-icofr-lifecycle-traceability.js'
      - 'package.json'
      - '.github/workflows/verify-icofr-traceability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  traceability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify:icofr-traceability
