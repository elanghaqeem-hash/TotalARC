name: Verify production ICOFR traceability

on:
  workflow_run:
    workflows: ['Deploy Total ARC to Cloudflare']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  traceability-production:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TOTALARC_PRODUCTION_URL: ${{ vars.TOTALARC_PRODUCTION_URL }}
      TOTAL_ARC_HEALTHCHECK_TOKEN: ${{ secrets.TOTAL_ARC_HEALTHCHECK_TOKEN }}
    steps:
      - name: Verify ICOFR lifecycle on production D1
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${TOTAL_ARC_HEALTHCHECK_TOKEN:-}" ]; then
            echo "::error::TOTAL_ARC_HEALTHCHECK_TOKEN is required."
            exit 1
          fi

          BASE_URL="${TOTALARC_PRODUCTION_URL:-https://totalarc.elang-haqeem.workers.dev}"
          BASE_URL="${BASE_URL%/}"
          OUT="/tmp/icofr-integrity.json"

          CODE="$(curl --silent --show-error --location --max-time 30             --output "$OUT"             --write-out "%{http_code}"             --header "X-Total-ARC-Health-Token: $TOTAL_ARC_HEALTHCHECK_TOKEN"             "$BASE_URL/api/system/icofr-integrity" || true)"

          cat "$OUT" | jq .

          if [ "$CODE" != "200" ]; then
            echo "::error::ICOFR integrity endpoint returned HTTP $CODE."
            exit 1
          fi

          jq -e '
            .storage == "cloudflare-d1" and
            .test == "ICOFR_END_TO_END_REFERENTIAL_INTEGRITY" and
            .completenessTest == "ICOFR_TRACEABILITY_COMPLETENESS" and
            .certificationTraceabilityTest == "ICOFR_CERTIFICATION_REFERENTIAL_INTEGRITY" and
            .checkedInstitutions >= 1 and
            .orphanCount == 0 and
            .crossTenantCount == 0 and
            .mandatoryChainGapCount == 0 and
            (.metrics.significantFinancialItems | type) == "number" and
            (.metrics.significantFinancialItemsWithAssertion | type) == "number" and
            (.metrics.assertionsWithProcess | type) == "number" and
            (.certificationMetrics | type) == "object" and
            ([.checks[] | select(.count != 0)] | length) == 0 and
            ([.completenessChecks[] | select(.count != 0)] | length) == 0 and
            .ok == true
          ' "$OUT" >/dev/null

          echo "### ICOFR Production Traceability" >> "$GITHUB_STEP_SUMMARY"
          jq -r '
            "- Status: " + (if .ok then "PASS" else "FAIL" end),
            "- Chain: " + (.chain | join(" → ")),
            "- Orphans: " + (.orphanCount|tostring),
            "- Cross-tenant: " + (.crossTenantCount|tostring),
            "- Mandatory chain gaps: " + (.mandatoryChainGapCount|tostring),
            "- Coverage: " + (.metrics.coveragePercent|tostring) + "%",
            "- Certification records: sub-cert=" + (.certificationMetrics.subCertifications|tostring) +
              ", attestation=" + (.certificationMetrics.managementAttestations|tostring) +
              ", evidence pack=" + (.certificationMetrics.evidencePacks|tostring)
          ' "$OUT" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout source for read-only D1 diagnosis
        if: failure()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node for diagnosis
        if: failure()
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Diagnose completeness SQL on pinned D1 (read only)
        if: failure()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          TOTALARC_D1_DATABASE_ID: ${{ vars.TOTALARC_D1_DATABASE_ID }}
          TOTALARC_D1_DATABASE_NAME: ${{ vars.TOTALARC_D1_DATABASE_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm ci --ignore-scripts
          node scripts/diagnose-icofr-completeness.cjs
