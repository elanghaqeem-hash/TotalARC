name: Inventory remaining Seraya sources

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inventory-seraya-remaining.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: List unnormalized Seraya UPDATE documents
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1.json
          DB_NAME="$(jq -r '(map(select((.name|ascii_downcase|contains("totalarc")) or (.name|ascii_downcase|contains("total-arc")))) | .[0].name) // (if length == 1 then .[0].name else empty end)' /tmp/d1.json)"
          test -n "$DB_NAME"
          echo "=== SERAYA NORMALIZATION COVERAGE ==="
          npx wrangler d1 execute "$DB_NAME" --remote --json --command "
            SELECT d.id,d.title,d.module,d.sourceKind,
                   COALESCE(json_extract(d.metadataJson,'$.sourceRole'),'UNSPECIFIED') sourceRole,
                   COALESCE(json_extract(d.metadataJson,'$.precedencePriority'),0) priority,
                   COUNT(sr.id) AS activeStructuredRecords,
                   d.textLength,d.rawSizeBytes
            FROM SourceDocument d
            LEFT JOIN SourceStructuredRecord sr
              ON sr.sourceDocumentId=d.id AND sr.status='Active'
            WHERE d.status='Active'
              AND json_extract(d.metadataJson,'$.sourceAccount')='serayamg@gmail.com'
            GROUP BY d.id
            ORDER BY activeStructuredRecords ASC,d.title ASC;
          "
