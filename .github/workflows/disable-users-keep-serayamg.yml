name: Disable Total ARC users except serayamg admin

on:
  push:
    branches: [main]
    paths:
      - 'scripts/disable-users-keep-serayamg.py'
      - '.github/workflows/disable-users-keep-serayamg.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: totalarc-user-disable-serayamg
  cancel-in-progress: false

jobs:
  disable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Disable every user except serayamg administrator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/disable-users-keep-serayamg.py serayamg@gmail.com
